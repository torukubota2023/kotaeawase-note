# ---------------------------------------------------------------- ワンハンド入力（2026-08-08 追記）
# 新規UI文言（組み立て）。ガイドからの転記ではなく、第4章疾患カード・30秒ルートの語彙から
# 組み立てた起草。承認ゲートで裁定される（突合表 §11「新規UI文言・承認待ち」参照）。
# questions の「◯」（side_slot）は側（右/左/両側）で置換するスロット。other はテンプレなし。
# first_dx_patterns は S2 第一候補サジェストの組み立て規則（{side}=選択した側・{label}=病態ラベル。
# {side} を含む型は側が選ばれているときだけ使う）。
# 2026-08-09 v1.2.0: questions を文字列から {text, qtype} の対象へ構造変更（text は不変・承認済み文言のまま）。
# qtype は問いの型: qual=定性（病態の有無を当てる）／quant=定量（数値を予測する）。既存6本はすべて qual。
quick_templates:
  side_slot: "◯"
  questions:
    # 2026-08-09 v1.3.0: 定量（quant）を4病態に1本ずつ追加（副院長承認）。
    # 問い文に【どこで測るか】を埋め込むのが手技を固定する仕掛け ── 測る線がぶれる人は、
    # 癖（平均のずれ）ではなくばらつき（SD・RCV）が大きく出る。
    # 単位は QUANT_UNITS（肋間 / cm / その他）の語彙内に収めてある。
    pneumonia:
      - {text: "◯下肺に実質化があるか", qtype: qual}
      # 音質そのものを較正する問い。この本の 3.4 が「聴診の目玉」と呼ぶ分けで、
      # 当てる前に fine か coarse かを書いてから、A-pattern か B-line かを見る。
      - {text: "◯下肺の crackles は fine か coarse か", qtype: qual}
      - {text: "◯下肺の実質化は、腋窩中線で何肋間ぶんの高さか", qtype: quant}
    effusion:
      - {text: "◯下肺の濁音・呼吸音減弱は胸水か、実質化か", qtype: qual}
      # 肋骨番号でなく肋間で数えるのは、単位語彙に合わせるためと、POCUS が
      # プローブを肋間に置いて上下させる手技だから。体表からの cm は上肢の挙上と体格で動く
      # （CT は両手挙上で撮る ── 肩甲下角は動くが、肋間の番号は動かない）
      - {text: "◯胸水の上縁は、腋窩中線で第何肋間の高さか", qtype: quant}
    pneumothorax:
      - {text: "◯肺の呼吸音低下・過共鳴は気胸か", qtype: qual}
      - {text: "◯肺の虚脱は、鎖骨中線で第何肋間まで及ぶか", qtype: quant}
    copd:
      - {text: "気流閉塞の増悪が主か、ほかの原因が混ざっているか", qtype: qual}
    asthma:
      - {text: "呼気気流制限はいま重症か", qtype: qual}
    hf:
      - {text: "両側下肺の crackles はうっ血か", qtype: qual}
      # howto は定量テンプレの任意項目（あれば予測値の下に畳んだ状態で出る）。
      # 視診の「拍動上縁」とエコーの「虚脱点」は同じ物理点（静脈内圧が大気圧と釣り合う高さ）なので、
      # 同じ物差し（胸骨角からの垂直距離）で並べられる。POCUS には虚脱点の同定だけをさせ、
      # +5cm 換算は持ち込まない（胸骨角と右房中心の距離は体位で変わる ── Cook & Simel 1996）。
      - text: "頸静脈の拍動上縁は、胸骨角の上何cmか"
        qtype: quant
        howto: |
          ① 背上げ角度を決めて記録する（例：背上げ45度）。同じ患者は毎回同じ角度で
          ② 頭を枕で支えて胸鎖乳突筋を脱力させる。顔はわずかに反対側へ（回旋・伸展はさせない）
          ③ 右の頸部で行う（右内頸静脈は腕頭静脈を介してほぼ直線的に右房へ通じる）
          ④ リニアプローブを短軸で当て、内頸静脈と総頸動脈を出す（静脈は非拍動性で、軽く押すとつぶれる）
          ⑤ プローブは皮膚に触れるだけ。ゼリーを多めに。押すと虚脱点が実際より低く出る
          ⑥ 短軸のまま頭側へゆっくり滑らせ、断面が消える高さ＝虚脱点を、呼気終末で決める
          ⑦ プローブ中央の皮膚に印をつける
          ⑧ 定規を2本。1本を胸骨角に当てて鉛直に立て、もう1本を印から水平に渡し、交わる目盛りを読む
          　 皮膚の上をなぞらない（斜めに測ると必ず高く出る）
          ⑨ 読んだ値がそのまま「胸骨角の上 N cm」。+5 は足さない
          ずれる向き … 押した→低く出る／回旋・伸展→動く／斜めに測った→高く出る／吸気で読んだ→低く出る
          測れないときは「評価できず」と記録する（高度うっ血で下顎角より上、脱水で鎖骨の下に隠れる）
  first_dx_patterns: ["{side} {label}", "{label}"]


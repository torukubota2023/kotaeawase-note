        group: "触診"
        priority: false
        note: ""
      - id: hf_cardiac_dullness_wide
        label: "心濁音拡大"
        group: "打診"
        priority: false
        note: ""
      - id: hf_basal_dullness
        label: "下肺野濁音（胸水合併時）"
        group: "打診"
        priority: false
        note: "胸水の合併に注意"
      - id: hf_fine_crackles
        label: "両側下肺野fine crackles"
        group: "聴診"
        priority: true
        note: "cracklesは重力依存性"
      - id: hf_s3
        label: "S3ギャロップ"
        group: "聴診"
        priority: true
        note: ""
      - id: hf_murmur
        label: "心雑音"
        group: "聴診"
        priority: false
        note: ""
    pocus_items:
      - id: hf_us_b_profile
        label: "B profile：lung sliding あり ＋ B-line 多数"
        note: "心原性肺水腫が代表"
        src: "profile表 B行"
        figure: b_lines
      - id: hf_us_bilat_bline
        label: "両側性B-line（3本以上）"
        note: "間質性肺水腫を示す"
        src: "ガイド第4章 心不全🩻段落（補遺1）"
        figure: b_lines
      - id: hf_us_bline_dist
        label: "B-line の分布"
        note: ""
        src: "別冊表3「むくみ、体重増加、心不全を疑う」行（②⑫）"
        figure: b_lines
      - id: hf_us_ivc
        label: "IVC の変動"
        note: ""
        src: "別冊表3「むくみ、体重増加、心不全を疑う」行（⑮）"
      - id: hf_us_pleural_line
        label: "胸膜線の性状"
        note: ""
        src: "別冊表3「むくみ、体重増加、心不全を疑う」行（⑬⑭）"
        figure: pleura_smooth
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17）。X線は Milne 1985 の
    #      主要3所見＋補助所見の構成に沿う（各所見の読み方の詳細は原著参照）----
    xray_items:
      - id: hf_xr_flow
        label: "肺血流の分布"
        note: "心原性・非心原性を分ける主要3所見の一つ（何をどう読むかの詳細は原著参照）"
        src: "Milne 1985（PMID 3872571）抄録・主要3所見"
      - id: hf_xr_edema_dist
        label: "肺水腫の分布"
        note: "主要3所見の一つ"
        src: "Milne 1985（PMID 3872571）抄録・主要3所見"
      - id: hf_xr_pedicle
        label: "血管茎（vascular pedicle）の幅"
        note: "主要3所見の一つ"
        src: "Milne 1985（PMID 3872571）抄録・主要3所見"
      - id: hf_xr_septal
        label: "小葉間隔壁の線（septal lines）"
        note: "外側胸膜面に直角に接する細い線。間質の液体貯留を映す。「Kerley線」は旧称（現用語集では非推奨）"
        src: "Fleischner用語集2024（PMID 38411514）septal thickening 項／Milne 1985（PMID 3872571）補助所見"
      - id: hf_xr_cuff_eff
        label: "気管支周囲の cuffing・胸水・心拡大"
        note: "補助所見。胸水は肋骨横隔膜角の鈍化から"
        src: "Milne 1985（PMID 3872571）補助所見／Fleischner用語集2024（PMID 38411514）pleural effusion 項"
    ct_items:
      - id: hf_ct_septal
        label: "小葉間隔壁の肥厚"
        note: "間質への液体貯留・リンパ路のうっ滞などで肥厚する"
        src: "Fleischner用語集2024（PMID 38411514）septal thickening 項"
      - id: hf_ct_ggo
        label: "すりガラス影"
        note: "肺胞の部分的な液体貯留などで生じる。CT でだけ使う用語"
        src: "Fleischner用語集2024（PMID 38411514）ground-glass 項"
      - id: hf_ct_effusion
        label: "胸水（重力側の液体貯留）"
        note: "濃度はさまざま"
        src: "Fleischner用語集2024（PMID 38411514）pleural effusion 項"
    integration_note: "うっ血セット：起座呼吸、JVD、S3、両側下肺野crackles、浮腫。S3とJVDは陽性なら強力（数値はガイド第6章／bedside-bayes 参照）。"
    next_step_note: "crackles単独は非特異的で、BNP/NT-proBNP、心エコー、LUS B-linesで統合し、治療反応は定点で追う。"


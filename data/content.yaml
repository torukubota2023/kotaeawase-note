# ---------------------------------------------------------------- 答え合わせ画像（v1.7.0）
# 答え合わせに使う画像の種類（主たる一つを選ぶ ── 2026-08-24 副院長裁定）。
# 後から撮った画像・確定情報は従来どおり「後日追記（5. 画像・検査・経過）」が受ける。
# ラベルは新規UI文言（承認は突合表 §17）。
modalities:
  - {id: pocus, label: "POCUS"}
  - {id: cxr, label: "胸部X線"}
  - {id: ct, label: "胸部CT"}
  - {id: other, label: "その他"}

site_options:
  sides: [右, 左, 両側]
  aspects: [前面, 側面, 背面]
  # 肋間チップは第2〜第10の全段へ拡張（親エージェント指示。既存チップの文言は不変。
  # 一肋間刻みの記録はガイド para181/1232「尾側から頭側へ一肋間ずつ打診し…肋間レベルで記録」による）
  ics_chips: [第2肋間, 第3肋間, 第4肋間, 第5肋間, 第6肋間, 第7肋間, 第8肋間, 第9肋間, 第10肋間, 肩甲骨下角の高さ]
  # 面ごとの垂直基準線（ガイド本文の用語どおり。背面はガイド3.3 聴打診法第2法の
  # 「脊柱寄り・中央・後腋窩線寄りの縦の平行線」方式＝para301）
  lines_by_aspect:
    前面: [胸骨外縁, 鎖骨中線]
    側面: [前腋窩線, 中腋窩線, 後腋窩線]
    背面: [脊柱寄り, 中央, 後腋窩線寄り]
  # cm 方式の起点ランドマーク（面ごと。すべてガイド本文に実在する語）
  cm_landmarks_by_aspect:
    前面: [鎖骨, 胸骨角]
    側面: [腋窩, 最下肋骨]
    背面: [肩甲骨下角, 脊柱, 最下肋骨]
  cm_directions: [頭側, 尾側, 内側, 外側]
  # S5 のワンタップ位置（build_lung_us_figures.py L683〜L694 の凡例より）
  pocus_presets:
    - {id: upper_blue, label: "upper BLUE点", desc: "上の手の中央。第2肋間・鎖骨中線あたり"}
    - {id: lower_blue, label: "lower BLUE点", desc: "下の手掌の中央。第4〜5肋間、やや外側"}
    - {id: plaps, label: "PLAPS点", desc: "lower BLUE と同じ高さで、後腋窩線との交点。体を起こすか側臥位にして背側へ回り込む"}
  # 胸部X線・CT 用のワンタップ位置（v1.7.0、2026-08-24 副院長裁定で6語を追加。
  # タップすると位置の1行として追加される。舌区は左上葉の一部だが、答えの記載単位として独立させる）
  lobe_chips: [右上葉, 右中葉, 右下葉, 左上葉, 舌区, 左下葉]
  # 区域の体表の点（0〜100 の正規化座標。back=背面／front=前面）。
  # ⚠⚠ これは【仮置き】である。区域の体表対応には確立した根拠が無い
  #   （Takahashi 2004, Chest, PMID 15006952：区域別体位は「解剖学的根拠がほとんど無い」。
  #    亜区域気管支の走行は個体差が大きい）。
  #   ★副院長が1点ずつ決めた値に置き換えるまで、画面は「仮置き」と名乗る。
  segment_points:
    右上葉: { S1: [30, 9, back], S2: [31, 19, back], S3: [33, 26, front] }
    右中葉: { S4: [24, 44, front], S5: [36, 46, front] }
    右下葉: { S6: [32, 34, back], S7: [40, 72, back], S8: [22, 58, front], S9: [20, 52, back], S10: [34, 64, back] }
    左上葉: { "S1+2": [70, 12, back], S3: [67, 26, front] }
    舌区:   { S4: [76, 44, front], S5: [66, 50, front] }
    左下葉: { S6: [68, 34, back], S8: [78, 58, front], S9: [80, 52, back], S10: [66, 64, back] }
  # 区域（経過モードの「範囲」で使う）。左S7は通常欠如するため置かない。
  segments_by_lobe:
    右上葉: ["S1", "S2", "S3"]
    右中葉: ["S4", "S5"]
    右下葉: ["S6", "S7", "S8", "S9", "S10"]
    左上葉: ["S1+2", "S3"]
    舌区: ["S4", "S5"]
    左下葉: ["S6", "S8", "S9", "S10"]


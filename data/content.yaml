quick_templates:
  side_slot: "◯"
  questions:
    # 2026-08-09 v1.3.0: 定量（quant）を4病態に1本ずつ追加（副院長承認）。
    # 問い文に【どこで測るか】を埋め込むのが手技を固定する仕掛け ── 測る線がぶれる人は、
    # 癖（平均のずれ）ではなくばらつき（SD・RCV）が大きく出る。
    # 単位は QUANT_UNITS（肋間 / cm / その他）の語彙内に収めてある。
    pneumonia:
      - {text: "◯下肺に実質化があるか", qtype: qual}
      # 音質そのものを較正する問い。この本の 3.4 が「聴診の目玉」と呼ぶ分けで、
      # 当てる前に fine か coarse かを書いてから、A-pattern か B-line かを見る。
      # reading_axis: このテンプレを選ぶと S2 に「耳の読み」チップが出て、
      # 読み（fine/coarse）が snapshot に固定される（v1.5.0「読みの軸」）。
      - {text: "◯下肺の crackles は fine か coarse か", qtype: qual, reading_axis: crackle_quality}
      - {text: "◯下肺の実質化は、腋窩中線で何肋間ぶんの高さか", qtype: quant}
    effusion:
      - {text: "◯下肺の濁音・呼吸音減弱は胸水か、実質化か", qtype: qual}
      # 肋骨番号でなく肋間で数えるのは、単位語彙に合わせるためと、POCUS が
      # プローブを肋間に置いて上下させる手技だから。体表からの cm は上肢の挙上と体格で動く
      # （CT は両手挙上で撮る ── 肩甲下角は動くが、肋間の番号は動かない）
      - {text: "◯胸水の上縁は、腋窩中線で第何肋間の高さか", qtype: quant}
    pneumothorax:
      - {text: "◯肺の呼吸音低下・過共鳴は気胸か", qtype: qual}
      - {text: "◯肺の虚脱は、鎖骨中線で第何肋間まで及ぶか", qtype: quant}
    copd:
      - {text: "気流閉塞の増悪が主か、ほかの原因が混ざっているか", qtype: qual}
    asthma:
      - {text: "呼気気流制限はいま重症か", qtype: qual}
    hf:
      - {text: "両側下肺の crackles はうっ血か", qtype: qual}
      # howto は定量テンプレの任意項目（あれば予測値の下に畳んだ状態で出る）。
      # 視診の「拍動上縁」とエコーの「虚脱点」は同じ物理点（静脈内圧が大気圧と釣り合う高さ）なので、
      # 同じ物差し（胸骨角からの垂直距離）で並べられる。POCUS には虚脱点の同定だけをさせ、
      # +5cm 換算は持ち込まない（胸骨角と右房中心の距離は体位で変わる ── Cook & Simel 1996）。
      - text: "頸静脈の拍動上縁は、胸骨角の上何cmか"
        qtype: quant
        howto: |
          ① 背上げ角度を決めて記録する（例：背上げ45度）。同じ患者は毎回同じ角度で
          ② 頭を枕で支えて胸鎖乳突筋を脱力させる。顔はわずかに反対側へ（回旋・伸展はさせない）
          ③ 右の頸部で行う（右内頸静脈は腕頭静脈を介してほぼ直線的に右房へ通じる）
          ④ リニアプローブを短軸で当て、内頸静脈と総頸動脈を出す（静脈は非拍動性で、軽く押すとつぶれる）
          ⑤ プローブは皮膚に触れるだけ。ゼリーを多めに。押すと虚脱点が実際より低く出る
          ⑥ 短軸のまま頭側へゆっくり滑らせ、断面が消える高さ＝虚脱点を、呼気終末で決める
          ⑦ プローブ中央の皮膚に印をつける
          ⑧ 定規を2本。1本を胸骨角に当てて鉛直に立て、もう1本を印から水平に渡し、交わる目盛りを読む
          　 皮膚の上をなぞらない（斜めに測ると必ず高く出る）
          ⑨ 読んだ値がそのまま「胸骨角の上 N cm」。+5 は足さない
          ずれる向き … 押した→低く出る／回旋・伸展→動く／斜めに測った→高く出る／吸気で読んだ→低く出る
          測れないときは「評価できず」と記録する（高度うっ血で下顎角より上、脱水で鎖骨の下に隠れる）
  first_dx_patterns: ["{side} {label}", "{label}"]

# ---------------------------------------------------------------- POCUS 参照図（v1.5.0）
# 答え合わせのときに開く模式図の文言。絵（SVG）は index.html の FIG_SVG が描く ──
# 医学文言はここが正本、図形はコード、という分担。
# ⚠ 較正は画像を正解にする作業ではない（ガイド 3.4）。図は S5（答え合わせ）でだけ開き、
#    S3（診察）からは開けない ── 先に見ると「聴こえた気に」なる（肺エコー図譜 第1章）。
# ⚠ 文献の感度・特異度・κ を書かない（README の線引き）。「1肋間に3本以上」は
#    所見の定義であって診断精度ではないので置ける。
pocus_figures:
  - id: a_pattern
    title: "A-pattern"
    caption: "胸膜線と平行な線（A-line）が等間隔でくり返す。含気が保たれているという意味で、それ以上のことは言わない。cracklesがあるのにA-patternなら、肺の中よりも気道側を先に考える手がかりになる。"
  - id: b_lines
    title: "B-line"
    caption: "胸膜線から画面の下端まで減衰せずに伸びるレーザー状の線。1肋間に3本以上で異常。本数は疾患を決めない ── 分けるのは胸膜線の性状と分布（正常域が残っているか）。"
  - id: consolidation
    title: "実質化"
    caption: "肺が肝臓のような均一な組織に見える（hepatization）。白い点は残った気管支（air bronchogram）。肺炎で見え、coarseが主だが、早期と治癒期にはfineが混じる。"
  - id: air_bronchogram
    title: "air bronchogram ── 動くか"
    caption: "実質化の中の気管支像が呼吸で動けば、気道が通じている＝肺炎の側。動かなければ無気肺の側。実質化を見たら、次はこの一点を確かめる。"
  - id: pleura_smooth
    title: "胸膜線 ── 平滑・連続"
    caption: "胸膜線が平滑・連続で、B-lineが均一に立ち、正常域を欠く。心原性肺水腫の側。エコーだけで心不全と確定はしない ── JVP・S3と束にする。"
  - id: pleura_irregular
    title: "胸膜線 ── 肥厚・不整"
    caption: "胸膜線が肥厚・不整・断裂し、B-lineが不均一で、正常域（spared area）が混じる。間質性肺疾患の側。Velcro様のfine cracklesと対で読む。"
  - id: effusion
    title: "胸水"
    caption: "横隔膜の上に無エコーの帯。四辺形（quad sign）に囲まれ、呼吸で肺の縁が出入りする。量の推移は打診濁音の上縁と併走させて追える。"


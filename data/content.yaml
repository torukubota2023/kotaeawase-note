# =============================================================================
# 答え合わせノート 医学コンテンツ正本
# 転記元との対応・編集の全記録は docs/content_map_reconciliation.md（突合表）を参照。
# 逐語転記が原則。文献の公表値としての診断の重みの数値（尤度比・感度特異度・κ）は載せず、
# 「（数値はガイド第6章／bedside-bayes 参照）」に置換している。
# 線引きの改訂（2026-08-09 副院長裁定）: 上の方針は「文献の公表値」について。
# 使用者自身の記録から実行時に算出する実測値（「自分の尤度比」v1.2.0）は表示する。
# この YAML は実測値の数値そのものを持たない ── アプリが端末内で計算する。
# 所見の定義に含まれる操作閾値（FET 6秒、奇脈>15mmHg、呼気延長＞4秒、B-line 3本以上）は残す。
# =============================================================================
meta:
  transcribed_at: "2026-08-08"
  sources:
    - file: "docs/education/呼吸器身体診察実践ガイド_2026_統合版.docx"
      parts:
        - "tables[17]〜[22]：第4章 疾患カード表（肺炎・胸水・気胸・COPD増悪・喘息発作・心不全（心原性肺水腫））。直前の見出し段落（para510/533/552/570/589/605）と最終行「統合の読み方」の内容（肺実質化セット／胸水セット／気胸セット／過膨張・気流閉塞セット／呼気気流制限／うっ血セット）の両方で疾患を同定済み"
        - "🚑 30秒ルート「まず探すN所見」段落：para[515]（肺炎）／para[538]（胸水）／para[557]＋⚠para[559]（気胸）／para[575]（COPD増悪）／para[594]（喘息発作）／para[610]（心不全）"
        - "第4章 🩻ベッドサイド統合段落（補遺1参照）：para[526]（肺炎）／para[547]（胸水）／para[563]〜[564]（気胸）／para[619]（心不全）── pocus_items の文言に使用"
        - "tables[56]：外れ方8分類（9行2列）"
        - "段落1211〜1238：第10章 06.5「症例で較正する」（決定木=para[1229]、一行記録=para[1230]、次の一手を一つ=para[1232]、一例から法則を作らない=para[1233]）"
        - "tables[66]：巻末「症例記録テンプレート」（9行2列）"
        - "位置ピッカー語彙（site_options.lines_by_aspect／cm_landmarks_by_aspect／cm_directions）：para[181]（頭側・尾側・一肋間ずつ）／para[199]（前腋窩線・鎖骨中線・中腋窩線）／para[215]（胸骨外縁・中腋窩線・内側）／para[287]（肩甲骨下角）／para[296]（脊柱）／para[301]（脊柱寄り・中央・後腋窩線寄り・最下肋骨・外側）／para[484]（胸骨角からの垂直距離を cm で）／para[763]（中腋窩線・腋窩）／para[1019]（第4–5肋間前〜中腋窩線・第2肋間鎖骨中線）／para[1221]（左右・面・基準線・肋間の順、肩甲骨下角の尾側）／para[1232]（尾側から頭側へ一肋間ずつ）"
    - file: "docs/education/肺エコー図譜_2026.docx"
      parts:
        - "tables[2]：ずれ方4分類＋次の一手（観察／手技／解釈／統合の4行）"
        - "tables[3]：入口→まず当てる場所→見る所見（6入口）"
    - file: "scripts/build_lung_us_figures.py"
      parts:
        - "L683〜L694：BLUE 点の凡例（upper BLUE／lower BLUE／PLAPS point の位置記述）── site_options.pocus_presets に使用"
        - "L713〜L719：BLUE profile 対応表（A／A′／B／B′／A/B／C／PLAPS → 病態）"
        - "L735〜L742：同図の注記（profileは型・A′→lung point確認・原法の下肢静脈エコー分岐）"
    # ---- v1.7.0 画像モダリティ拡張（2026-08-24 起草。承認は突合表 §17）----
    # xray_items / ct_items の所見定義の出典。抄録・本文の取得記録は
    # ai-management リポジトリの pubmed-cache/ にある。定義のみを転記し、
    # 感度・特異度・尤度比・診断精度の数値は載せない（冒頭の線引きのとおり）。
    - file: "PubMed 一次資料（v1.7.0 xray_items / ct_items の定義出典）"
      parts:
        - "Fleischner Society 用語集 2024（Bankier ら. Radiology 2024;310(2):e232558. PMID 38411514・DOI 10.1148/radiol.232558）── consolidation・air bronchogram・ground-glass・septal thickening・pneumothorax（visceral pleural line・deep sulcus sign・緊張気胸の画像相関）・silhouette sign・pleural effusion・atelectasis・emphysema・air trapping・mosaic attenuation・mucoid impaction の各定義。RSNA 公開全文で本文の定義文を確認済み"
        - "Gordon R. The deep sulcus sign. Radiology 1980;136(1). PMID 7384513・DOI 10.1148/radiology.136.1.7384513 ── 仰臥位気胸の deep sulcus sign（原著。抄録で確認）"
        - "Milne ENC ら. The radiologic distinction of cardiogenic and noncardiogenic edema. AJR 1985;144(5):879-. PMID 3872571・DOI 10.2214/ajr.144.5.879 ── 心原性肺水腫の胸部X線 主要3所見（肺血流の分布・肺水腫の分布・血管茎の幅）＋補助7所見（抄録に列挙。読み方の詳細は原著参照）"
        - "Felson B, Felson H. Localization of intrathoracic lesions by means of the postero-anterior roentgenogram; the silhouette sign. Radiology 1950;55(3):363-. PMID 14781343・DOI 10.1148/55.3.363 ── silhouette sign（原著）"
        - "Thurlbeck WM, Simon G. Radiographic appearance of the chest in emphysema. AJR 1978;130(3):429-. PMID 415543・DOI 10.2214/ajr.130.3.429 ── 気腫の胸部X線所見（肺の縦長化・横隔膜低位・後胸骨腔拡大・血管影の乏しさ。抄録で確認。精度の数値は転記しない）"

diseases:
  # ---------------------------------------------------------------- 肺炎
  - id: pneumonia
    label: "肺炎"
    exam_items:
      - id: pn_fever_chills
        label: "発熱、悪寒"
        group: "視診"
        priority: false
        note: "高齢者では典型的症状に乏しい"
      - id: pn_dyspnea_mild
        label: "軽度の呼吸困難"
        group: "視診"
        priority: false
        note: ""
      - id: pn_cough_purulent
        label: "咳嗽、膿性痰"
        group: "視診"
        priority: false
        note: ""
      - id: pn_fremitus_inc
        label: "声音振盪増強"
        group: "触診"
        priority: false
        note: "肥満例では判定困難"
      - id: pn_expansion_mild_limit
        label: "胸郭運動軽度制限"
        group: "触診"
        priority: false
        note: ""
      - id: pn_dullness
        label: "局在性濁音"
        group: "打診"
        priority: true
        note: "小さな病変では検出困難"
      - id: pn_border_clear
        label: "境界比較的明瞭"
        group: "打診"
        priority: false
        note: ""
      - id: pn_bronchial_breath
        label: "気管支呼吸音"
        group: "聴診"
        priority: true
        note: "肺野で気管の音が聴こえたら異常"
      - id: pn_crackles
        label: "限局性のcrackles（吸気）"
        group: "聴診"
        priority: true
        note: "読む軸は音質と、吸気の終わりまで届くか（3.4）／初期はcoarse・吸気中期、改善とともに短くなり吸気後半へ移動しfine寄り（Piirilä 1992）／初期では副雑音が目立たない"
      - id: pn_voice_test
        label: "声音テスト陽性"
        group: "聴診"
        priority: true
        note: "ヤギ音／気管支声"
    pocus_items:
      - id: pn_us_consol
        label: "実質化"
        note: "hepatization（肝様変化）"
        src: "別冊表3「発熱＋咳、肺炎を疑う」行（③）／ガイド第4章 肺炎🩻段落（補遺1）"
        figure: consolidation
      - id: pn_us_air_bronchogram
        label: "air bronchogram が動くか"
        note: "dynamic air bronchogram"
        src: "別冊表3「発熱＋咳、肺炎を疑う」行（⑨）／ガイド第4章 肺炎🩻段落（補遺1）"
        figure: air_bronchogram
      - id: pn_us_plaps
        label: "PLAPS（背側に胸水＋実質化）"
        note: "肺炎（背側に寄った型）"
        src: "別冊表3「発熱＋咳、肺炎を疑う」行（⑩）／profile表 PLAPS行"
        figure: consolidation
      - id: pn_us_b_prime
        label: "B′ profile：lung sliding なし ＋ B-line 多数"
        note: "肺炎を疑う"
        src: "profile表 B′行"
        figure: b_lines
      - id: pn_us_ab
        label: "A/B profile：片側 A・対側 B と左右差"
        note: "肺炎を疑う"
        src: "profile表 A/B行"
      - id: pn_us_c
        label: "C profile：前方に実質化がある"
        note: "肺炎（前方に及ぶ型）"
        src: "profile表 C行"
        figure: consolidation
      # crackles の音質を較正するときの相手。fine と読んだら B-line と胸膜線の不整、
      # coarse と読んだら A-pattern が保たれることを、当てる前に書く（ガイド 3.4 の 🩻）。
      - id: pn_us_a_pattern
        label: "A-pattern（胸膜線と平行な線がくり返す＝含気が保たれる）"
        note: "coarse と読んだときの予測の相手。crackles があるなら気道側を先に考える"
        src: "ガイド第3章 3.4 🩻（図3-5c）"
        figure: a_pattern
      - id: pn_us_bline_pleura
        label: "B-line ＋ 胸膜線の不整"
        note: "fine と読んだときの予測の相手"
        src: "ガイド第3章 3.4 🩻（図3-5c）"
        figure: pleura_irregular
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17。出典は meta.sources の PubMed エントリ）----
    xray_items:
      - id: pn_xr_consol
        label: "均等な濃度上昇（実質化）"
        note: "肺胞の空気が液体などに置き換わった状態。X線では均一な濃度上昇に見える。原因の病理までは決めない"
        src: "Fleischner用語集2024（PMID 38411514）consolidation 項"
      - id: pn_xr_airbronch
        label: "air bronchogram"
        note: "含気を失った肺の中に、空気の残った気管支が透けて見える。中枢気道が開通している含意"
        src: "Fleischner用語集2024（PMID 38411514）air bronchogram 項"
      - id: pn_xr_silhouette
        label: "silhouette sign（隣接する正常輪郭の消失）"
        note: "X線吸収が近い構造どうしが接すると正常の輪郭が消える。どの輪郭が消えたかで病変の葉を当てる。漏斗胸など肺以外でも起こる"
        src: "Felson 1950（PMID 14781343）原著／Fleischner用語集2024（PMID 38411514）silhouette sign 項"
    ct_items:
      - id: pn_ct_consol
        label: "実質化（下層の血管・気管支が透けない濃度上昇）"
        note: "開通した気管支が中に残れば air bronchogram になる"
        src: "Fleischner用語集2024（PMID 38411514）consolidation 項"
      - id: pn_ct_ggo
        label: "すりガラス影（血管・気管支が透けて見える淡い濃度上昇）"
        note: "肺胞の空気が完全には失われていない段階。CT でだけ使う用語"
        src: "Fleischner用語集2024（PMID 38411514）ground-glass 項"
    integration_note: "肺実質化セット：局所crackles、濁音、気管支呼吸音、声音テスト陽性。陽性なら肺炎方向に動くが、同一病態の相関所見なのでLRを単純積算しない。側臥位のラ音も価値が高い（3.4・補遺4）。"
    next_step_note: "陰性で除外せず、高齢者・初期病変・脱水例・好中球減少や免疫抑制の例ではPOCUS/胸部画像へ。／音質を較正するとき、的は「cracklesがB-lineと一致すること」ではなく「自分の読み（間質か気道か）が肺の見え方と合うこと」。音とエコーは同じものを測っていないので、一致しないこと自体は誤りではない。crackles陰性でも肺うっ血は除外できず、間質性肺疾患ではエコーはfine cracklesの金標準にならない。数値はガイド3.4へ。"

  # ---------------------------------------------------------------- 胸水
  - id: effusion
    label: "胸水"
    exam_items:
      - id: ef_dyspnea
        label: "呼吸困難"
        group: "視診"
        priority: false
        note: "少量では症状軽微"
      - id: ef_lateral_decubitus
        label: "患側臥位を好む"
        group: "視診"
        priority: false
        note: ""
      - id: ef_tracheal_dev_visible
        label: "大量では気管偏位"
        group: "視診"
        priority: true
        note: ""
      - id: ef_fremitus_dec
        label: "声音振盪著明な低下"
        group: "触診"
        priority: true
        note: "液面上では正常のことも"
      - id: ef_expansion_limit
        label: "胸郭拡張制限"
        group: "触診"
        priority: false
        note: ""
      - id: ef_tracheal_dev_palp
        label: "大量では気管健側偏位"
        group: "触診"
        priority: true
        note: ""
      - id: ef_stony_dullness
        label: "石様濁音（stony dull）"
        group: "打診"
        priority: true
        note: "500mL以上で検出可能"
      - id: ef_border_sharp
        label: "境界明瞭"
        group: "打診"
        priority: false
        note: ""
      - id: ef_shift_with_position
        label: "体位変換で移動"
        group: "打診"
        priority: false
        note: ""
      - id: ef_bs_diminished
        label: "呼吸音著明な減弱"
        group: "聴診"
        priority: true
        note: "液面上では気管支呼吸音も"
      - id: ef_voice_test_neg
        label: "濁音域では声音テスト陰性（伝導低下）"
        group: "聴診"
        priority: false
        note: ""
      - id: ef_egophony_upper
        label: "濁音上縁でのみヤギ音（Egophony）陽性（圧迫肺による）"
        group: "聴診"
        priority: false
        note: ""
    pocus_items:
      - id: ef_us_effusion
        label: "胸水"
        note: ""
        src: "別冊表3「片側の呼吸音が弱い」行（④）"
        figure: effusion
      - id: ef_us_curtain
        label: "curtain sign"
        note: "量の半定量と穿刺の安全域決定に直結する"
        src: "ガイド第4章 胸水🩻段落（補遺1）"
      - id: ef_us_anechoic
        label: "横隔膜上のanechoic帯"
        note: ""
        src: "ガイド第4章 胸水🩻段落（補遺1）"
        figure: effusion
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17）----
    xray_items:
      - id: ef_xr_blunting
        label: "肋骨横隔膜角の鈍化（上縁はしばしば半月状）"
        note: "少量胸水の X線での現れ方"
        src: "Fleischner用語集2024（PMID 38411514）pleural effusion 項"
      - id: ef_xr_homog
        label: "重力側の均等な濃度上昇"
        note: "量が増えたときの現れ方。実質化との見分けでは air bronchogram の有無が手がかり（あるなら実質化の側）"
        src: "Fleischner用語集2024（PMID 38411514）pleural effusion 項・air bronchogram 項"
    ct_items:
      - id: ef_ct_dependent
        label: "背側（重力側）の液体貯留"
        note: "濃度はさまざま"
        src: "Fleischner用語集2024（PMID 38411514）pleural effusion 項"
      - id: ef_ct_atelect
        label: "圧排された無気肺（容積減少＋濃度上昇）"
        note: "胸水に圧された肺は容積が減り濃度が上がる。濁音の原因が水か肺かを分ける相手"
        src: "Fleischner用語集2024（PMID 38411514）atelectasis 項"
    integration_note: "胸水セット：石様濁音、呼吸音減弱、声音振盪低下、上縁のヤギ音。（数値はガイド第6章／bedside-bayes 参照）ただし濁音は検者間一致が高く、境界を追いやすい。上縁を同じ体位で定点化すると量の変化を追える。"
    next_step_note: "少量・仰臥位では見逃すため、手技前は超音波で量と安全域を確認する（BTS 2023）。"

  # ---------------------------------------------------------------- 気胸
  - id: pneumothorax
    label: "気胸"
    exam_items:
      - id: px_sudden_pain
        label: "突然の胸痛"
        group: "視診"
        priority: false
        note: "小気胸では症状軽微"
      - id: px_dyspnea
        label: "呼吸困難"
        group: "視診"
        priority: false
        note: ""
      - id: px_chest_motion_dec
        label: "患側胸郭運動低下"
        group: "視診"
        priority: false
        note: ""
      - id: px_jvd
        label: "頸静脈怒張"
        group: "視診"
        priority: true
        note: "緊張性では気管が健側へ偏位＋頸静脈怒張＋血行動態不安定"
      - id: px_fremitus_dec
        label: "声音振盪低下"
        group: "触診"
        priority: true
        note: ""
      - id: px_expansion_limit
        label: "胸郭拡張制限"
        group: "触診"
        priority: false
        note: ""
      - id: px_tracheal_dev
        label: "緊張性では気管偏位"
        group: "触診"
        priority: true
        note: "緊張性気胸では緊急対応要／⚠ 緊張性気胸を疑う（片側呼吸音消失＋進行する低酸素または循環不全。気管偏位は無くても否定しない）なら、画像確認前に直ちに脱気（第7章）"
      - id: px_hyperresonance
        label: "過共鳴"
        group: "打診"
        priority: true
        note: "小気胸では判定困難"
      - id: px_asymmetry
        label: "軽度〜中等度の左右差"
        group: "打診"
        priority: false
        note: ""
      - id: px_bs_dim_absent
        label: "呼吸音減弱〜消失"
        group: "聴診"
        priority: true
        note: "完全虚脱では呼吸音消失"
      - id: px_no_adventitious
        label: "副雑音なし"
        group: "聴診"
        priority: false
        note: ""
    pocus_items:
      - id: px_us_sliding_loss
        label: "lung sliding 消失"
        note: "気胸を強く示唆"
        src: "別冊表3「急に呼吸が悪化した、気胸を疑う」行（⑥）／ガイド第4章 気胸🩻段落（補遺1）"
      - id: px_us_lung_point
        label: "lung point"
        note: "見つかれば気胸を強く支持"
        src: "別冊表3「急に呼吸が悪化した、気胸を疑う」行（⑧）"
      - id: px_us_a_prime
        label: "A′ profile：lung sliding なし ＋ A-line"
        note: "気胸を疑う／気腫肺・無呼吸・胸膜癒着でも sliding は落ちるため、A′ から気胸へ進むときは lung point（⑧）を探して確かめる"
        src: "profile表 A′行＋同図の注記"
        figure: a_pattern
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17）----
    xray_items:
      - id: px_xr_pleural_line
        label: "臓側胸膜線（visceral pleural line）"
        note: "胸膜腔の空気と含気肺の境界を示す曲線状の線。立位X線での気胸の同定はこれによる"
        src: "Fleischner用語集2024（PMID 38411514）pneumothorax 項"
      - id: px_xr_deep_sulcus
        label: "deep sulcus sign（仰臥位）"
        note: "仰臥位では胸膜線が写らないことがあり、患側の肋骨横隔膜角が異常に深く・黒く・鋭くなる所見が唯一の手がかりになりうる"
        src: "Gordon 1980（PMID 7384513）原著／Fleischner用語集2024（PMID 38411514）pneumothorax 項"
      - id: px_xr_tension
        label: "縦隔の対側偏位・患側横隔膜の低下"
        note: "緊張気胸に相関する画像。ただし緊張気胸の確定は臨床・生理学的基準で決める"
        src: "Fleischner用語集2024（PMID 38411514）pneumothorax 項"
    ct_items:
      - id: px_ct_air
        label: "胸膜腔の空気（臓側・壁側胸膜の分離）"
        note: "仰臥位 CT では空気は腹側（非重力側）に集まりやすい（分布の一文は定義からの組み立て）"
        src: "Fleischner用語集2024（PMID 38411514）pneumothorax 項"
    integration_note: "気胸セット：突然発症、片側呼吸音低下、過共鳴、声音振盪低下。陽性なら強く疑うが、小気胸では身体所見が乏しい。"
    next_step_note: "緊張性なら画像を待たず、安定例・外傷・仰臥位ではPOCUS（lung sliding/lung point）で確認する。"

  # ---------------------------------------------------------------- COPD増悪
  - id: copd
    label: "COPD増悪"
    exam_items:
      - id: cp_barrel_chest
        label: "樽状胸"
        group: "視診"
        priority: true
        note: "慢性変化と急性増悪の鑑別"
      - id: cp_exp_prolong_insp
        label: "呼気延長"
        group: "視診"
        priority: true
        note: ""
      - id: cp_pursed_lip
        label: "口すぼめ呼吸"
        group: "視診"
        priority: true
        note: ""
      - id: cp_cyanosis
        label: "チアノーゼ"
        group: "視診"
        priority: false
        note: ""
      - id: cp_hoover
        label: "Hoover徴候"
        group: "視診"
        priority: true
        note: "吸気時に下位肋骨が奇異性に内方移動"
      - id: cp_accessory_muscle
        label: "呼吸補助筋使用"
        group: "視診"
        priority: true
        note: "増悪では呼吸補助筋使用・会話困難"
      - id: cp_speech_difficulty
        label: "会話困難"
        group: "視診"
        priority: true
        note: ""
      - id: cp_expansion_limit
        label: "胸郭拡張制限"
        group: "触診"
        priority: false
        note: "両側性の変化"
      - id: cp_fremitus_mild_dec
        label: "声音振盪軽度低下"
        group: "触診"
        priority: false
        note: ""
      - id: cp_hyperresonance
        label: "軽度過共鳴"
        group: "打診"
        priority: true
        note: "過膨張による変化／30秒ルートでは「両側の過共鳴（打診）」"
      - id: cp_lung_base_low
        label: "肺下縁低下"
        group: "打診"
        priority: false
        note: ""
      - id: cp_bs_global_dim
        label: "呼吸音全体的に減弱"
        group: "聴診"
        priority: false
        note: ""
      - id: cp_exp_prolong_ausc
        label: "呼気延長（＞4秒）"
        group: "聴診"
        priority: true
        note: ""
      - id: cp_wheeze_rhonchi
        label: "散在性 wheeze/rhonchi"
        group: "聴診"
        priority: true
        note: ""
      - id: cp_silent_chest
        label: "Silent chest（重症）"
        group: "聴診"
        priority: false
        note: "Silent chestは危険所見"
    pocus_items:
      - id: cp_us_a_profile
        label: "A profile：lung sliding あり ＋ A-line"
        note: "profile はあくまで「型」であり、これだけで診断を確定しない。身体所見と経過、必要な画像と併せて判断する。原法は A profile から喘息／COPD へ進む前に、下肢静脈エコーで肺塞栓を除外する。"
        src: "profile表 A行（示唆される病態＝喘息／COPD）＋同図の注記"
        figure: a_pattern
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17）----
    xray_items:
      - id: cp_xr_hyperinfl
        label: "過膨張（肺の縦長化・横隔膜の低位・後胸骨腔の拡大）"
        note: "気腫が進むほど肺は長く、横隔膜は低くなる。肺の長さと横隔膜の位置が最も判別的な計測だった"
        src: "Thurlbeck & Simon 1978（PMID 415543）抄録"
      - id: cp_xr_art_def
        label: "血管影の乏しさ（arterial deficiency）"
        note: "気腫のX線診断の主基準とされた所見"
        src: "Thurlbeck & Simon 1978（PMID 415543）抄録"
    ct_items:
      - id: cp_ct_emphysema
        label: "気腫（壁のない低吸収域）"
        note: "終末細気管支より末梢の気腔の不可逆的な拡大と肺胞壁の破壊。小葉中心性は上肺野優位が典型"
        src: "Fleischner用語集2024（PMID 38411514）emphysema 項"
      - id: cp_ct_airtrap
        label: "air trapping（呼気CT）"
        note: "呼気で濃度が上がらず容積が減らない領域。呼気CTでのみ判定する"
        src: "Fleischner用語集2024（PMID 38411514）air trapping 項"
    integration_note: "過膨張・気流閉塞セット：FET延長、Hoover徴候、過共鳴、呼吸音減弱。FETは6秒以上を疑う入口、8〜9秒超をより強い支持所見として段階的に読む。身体診察はCOPDを疑い、増悪の重症度と治療反応を追う道具。"
    next_step_note: "GOLD 2026でも診断確定はスパイロメトリー（FEV1/FVC<0.7）。"

  # ---------------------------------------------------------------- 喘息発作
  - id: asthma
    label: "喘息発作"
    exam_items:
      - id: as_dyspnea
        label: "呼吸困難"
        group: "視診"
        priority: false
        note: "重症度の迅速評価が重要"
      - id: as_sitting
        label: "起座位"
        group: "視診"
        priority: true
        note: "tripod位"
      - id: as_accessory_muscle
        label: "補助呼吸筋使用"
        group: "視診"
        priority: true
        note: ""
      - id: as_sweating
        label: "発汗"
        group: "視診"
        priority: false
        note: ""
      - id: as_word_by_word
        label: "会話が単語単位"
        group: "視診"
        priority: true
        note: "重症化サイン"
      - id: as_cyanosis
        label: "チアノーゼ"
        group: "視診"
        priority: true
        note: "重症化サイン"
      - id: as_expansion_slight
        label: "胸郭拡張やや制限"
        group: "触診"
        priority: false
        note: ""
      - id: as_pulsus_paradoxus
        label: "奇脈（重症時）"
        group: "触診"
        priority: true
        note: "奇脈は重症度の指標／>15mmHg（重症化サイン）"
      - id: as_hyperres_mild
        label: "軽度過共鳴"
        group: "打診"
        priority: false
        note: "発作時のみ検出／診断的価値は限定的"
      - id: as_wheeze
        label: "両側性高調wheeze"
        group: "聴診"
        priority: true
        note: ""
      - id: as_exp_dominant
        label: "呼気優位"
        group: "聴診"
        priority: true
        note: ""
      - id: as_exp_prolong
        label: "呼気延長"
        group: "聴診"
        priority: true
        note: ""
      - id: as_silent_chest
        label: "Silent chest（重症時）"
        group: "聴診"
        priority: true
        note: "Silent chestは最重症／重症化サイン＝wheezeの消失"
    pocus_items:
      - id: as_us_a_profile
        label: "A profile：lung sliding あり ＋ A-line"
        note: "profile はあくまで「型」であり、これだけで診断を確定しない。身体所見と経過、必要な画像と併せて判断する。原法は A profile から喘息／COPD へ進む前に、下肢静脈エコーで肺塞栓を除外する。"
        src: "profile表 A行（示唆される病態＝喘息／COPD）＋同図の注記"
        figure: a_pattern
    # ---- v1.7.0 胸部X線/CT（起草・承認待ち → 突合表 §17）。喘息の画像は
    #      「発作そのものの証明」より合併症・別診断の除外が答えになることが多いため、
    #      項目は合併症側に寄せてある（この設計判断も §17 で裁定対象）----
    xray_items:
      - id: as_xr_pneumothorax
        label: "気胸の合併（臓側胸膜線）"
        note: "胸膜腔の空気と含気肺の境界線。合併症の除外として探す"
        src: "Fleischner用語集2024（PMID 38411514）pneumothorax 項"
      - id: as_xr_atelect
        label: "無気肺（容積減少＋濃度上昇）"
        note: "粘液栓（mucoid impaction）による区域性の含気低下として現れうる"
        src: "Fleischner用語集2024（PMID 38411514）atelectasis 項・mucoid impaction 項"
    ct_items:
      - id: as_ct_mucoid
        label: "粘液栓（mucoid impaction）"
        note: "気道が粘液で満たされる。閉塞性にも非閉塞性にも起こる"
        src: "Fleischner用語集2024（PMID 38411514）mucoid impaction 項"
      - id: as_ct_airtrap
        label: "air trapping（呼気CT）・モザイク濃度（吸気CT）"
        note: "air trapping は呼気CTでのみ、モザイク濃度は完全吸気CTでのみ判定する"
        src: "Fleischner用語集2024（PMID 38411514）air trapping 項・mosaic attenuation 項"
    integration_note: "呼気気流制限の手がかり：呼気延長、wheeze、air entry低下、呼吸仕事量増加。これらは原因を特定しない。"
    next_step_note: "身体診察は重症度とT0からの変化を追い、喘息診断は変動する症状＋客観的な可変性気流制限で確認する（GINA 2026）。"


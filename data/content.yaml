miss_classification:
  categories:
    - {id: observation, label: 観察の誤り, desc: "出ていた所見を拾えなかった。左右を比べていない、聴く場所が足りない"}
    - {id: technique, label: 手技の誤り, desc: "取り方が違った。打診が強すぎる、体位が合っていない、声を止めさせて比べた"}
    - {id: interpretation, label: 解釈の誤り, desc: "所見は取れたが、意味を取り違えた。濁音を胸水と読んで、無気肺を考えなかった"}
    - {id: integration, label: 統合の誤り, desc: "個々は合っていたが、束ね方を誤った。相関する所見を独立に数えて確信を上げすぎた"}
    - {id: anatomy, label: 解剖の理解不足, desc: "所見の場所と肺葉の対応がずれた。後胸部だけで中葉・舌区を探した"}
    - {id: conditions, label: 診察条件の制約, desc: "肥満・胸壁の厚み・体位・騒音・小さく深い病変。腕ではなく条件の問題"}
    - {id: timecourse, label: 病態の時間的変化, desc: "診察と画像のあいだに病態が動いた。所見が正しく、画像も正しいことがある"}
    - {id: reference, label: 比較基準の不確実性, desc: "画像や最終診断のほうが確定していない。読影者間でも判定が割れる領域がある"}
  tree:
    root: q0
    nodes:
      - id: q0
        text: "その前にひとつ外す ── どちらかが「測れていなかっただけ」ではないか。その場合は自分のずれではない。"
        options:
          - {label: "測れていなかっただけ", next: q0b}
          - {label: "測れていた（自分のずれを分ける）", next: qa}
      - id: q0b
        text: "「測れていなかった」の中身はどれか（表の下3行がこれにあたる）。"
        options:
          - {label: "肥満・胸壁の厚み・体位・騒音・小さく深い病変", result: conditions}
          - {label: "診察と画像のあいだに病態が動いた", result: timecourse}
          - {label: "画像や最終診断のほうが確定していない", result: reference}
      - id: qa
        text: "所見の場所と肺葉の対応はずれていなかったか（解剖の理解不足は、取る側にも読む側にも根として現れる）。"
        options:
          - {label: "対応がずれていた", result: anatomy}
          - {label: "ずれていない", next: q1}
      - id: q1
        text: "問い1 ── 答えに照らして、所見そのものは合っていたか。"
        options:
          - {label: "違っていた（「取るとき」のずれ）", next: q2take}
          - {label: "合っていた（「読むとき」のずれ）", next: q2read}
      - id: q2take
        text: "体位や当て方を変えれば取れたか、ただ拾い損ねたか。"
        options:
          - {label: "体位や当て方を変えれば取れた", result: technique}
          - {label: "ただ拾い損ねた", result: observation}
      - id: q2read
        text: "一つの所見の意味を取り違えたか、組み合わせか。"
        options:
          - {label: "一つの所見の意味を取り違えた", result: interpretation}
          - {label: "組み合わせ（束ね方）", result: integration}
  next_hints:
    - {category: observation, hint: "次はそこを意識して取りにいく"}
    - {category: technique, hint: "体位を変える。座位か側臥位へ"}
    - {category: interpretation, hint: "その所見が本当は何を見ているか調べ直す"}
    - {category: integration, hint: "文脈を一つ足して読み直す（分布・体位・重力）"}


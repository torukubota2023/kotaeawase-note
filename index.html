<style>
:root{
  --ground:#EBF0EB; --panel:#FCFDFC; --rule:#C2CFC4; --rule-2:#DCE4DD;
  --ink:#17251C; --ink-2:#48594E; --ink-3:#5F7064;
  --accent:#1F5C3A; --accent-weak:#E7F0E9;
  --pos:#9C2A3B; --neg:#2A5C8A; --warn:#C08A1A; --warn-ink:#8A5A00; --warn-bg:#FAF3E3;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.7;
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px),linear-gradient(90deg,var(--rule-2) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
  overflow-x:hidden;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 96px}
header.top{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.35;margin:4px 0 2px;letter-spacing:.02em}
h1 .sub{display:block;font-size:12px;font-family:var(--sans);font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--rule);padding:14px;margin-bottom:12px}
.panel h2{font-family:var(--serif);font-size:15px;margin:0 0 10px;font-weight:600;
  display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule-2);padding-bottom:7px}
.panel h2 small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:400}
.note{font-size:12px;color:var(--ink-2);line-height:1.75}
.subnote{font-size:11px;color:var(--ink-3);line-height:1.7}
.field{margin:12px 0}
.field>label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.field>label b{font-family:var(--mono);font-size:14px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;font-family:var(--sans);font-size:16px;padding:10px;border:1px solid var(--rule);
  background:#fff;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{resize:vertical;line-height:1.7}
input:disabled,textarea:disabled,select:disabled{background:#F2F5F2;color:var(--ink-3)}
input::placeholder,textarea::placeholder{color:#A9B5AB;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--rule);background:#fff;color:var(--ink-2);font-family:var(--sans);
  font-size:13px;padding:8px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.55;cursor:default}
/* 診察中の親指向け: タップ標的は 48px（2026-08-08 片手入力対応） */
@media(pointer:coarse){.chip{min-height:48px;padding:12px 15px}.btn{min-height:48px}}
.confrow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0;padding:0;border:0;-webkit-appearance:auto;appearance:auto}
.fnd{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--rule-2)}
.fnd .nm{font-size:13px;line-height:1.5;min-width:0;overflow-wrap:break-word}
.fnd .meta{font-size:10.5px;color:var(--ink-3);line-height:1.5}
.pri{color:var(--accent);margin-right:2px}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);
  border-bottom:1px solid var(--rule-2);padding:12px 0 3px;margin-bottom:4px}
.cat:first-of-type{padding-top:0}
.tri{display:flex;border:1px solid var(--rule);background:#fff;flex:none}
.tri button{border:0;background:transparent;font-family:var(--mono);font-size:11px;padding:5px 8px;
  cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule-2)}
@media(pointer:coarse){.tri button{font-size:12px;padding:13px 10px;min-height:48px}}
.tri button:last-child{border-right:0}
.tri button:disabled{cursor:default;opacity:.6}
.tri button[aria-pressed="true"]{color:#fff;opacity:1}
.tri button.pos[aria-pressed="true"]{background:var(--pos)}
.tri button.neg[aria-pressed="true"]{background:var(--neg)}
.tri button.non[aria-pressed="true"]{background:var(--ink-3)}
.btn{font-family:var(--sans);font-size:13px;padding:10px 14px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.btn.line{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--pos);border-color:var(--pos)}
.btn.small{font-size:12px;padding:6px 10px;min-height:36px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow.split{justify-content:space-between}
.lockbox{border:2px solid var(--accent);background:var(--accent-weak);padding:14px;margin:12px 0}
.lockbox .big{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--accent);margin-bottom:6px}
.lockbtn{width:100%;font-family:var(--serif);font-size:15px;letter-spacing:.05em;padding:16px;margin-top:8px}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border:1px solid;margin:0 4px 2px 0;vertical-align:1px;white-space:nowrap}
.b-edit{color:var(--warn-ink);border-color:var(--warn);background:var(--warn-bg);font-weight:700}
.b-draft{color:var(--ink-3);border-color:var(--rule)}
.b-locked{color:var(--accent);border-color:var(--accent)}
.b-rev{color:#fff;border-color:var(--accent);background:var(--accent)}
.b-out{color:var(--neg);border-color:var(--neg)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--panel);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.card:hover{background:var(--accent-weak)}
.card .t{font-family:var(--serif);font-size:14px;font-weight:600;margin:2px 0;overflow-wrap:break-word}
.card .d{font-size:11px;color:var(--ink-3)}
.qcard{border:1px dashed var(--rule);background:transparent;padding:7px 12px;margin-bottom:8px;
  font-size:12px;color:var(--ink-2);overflow-wrap:break-word}
.qcard .d{font-size:10.5px;color:var(--ink-3)}
.banner{border:1px solid var(--accent);background:var(--accent-weak);padding:10px 12px;margin-bottom:10px;
  font-size:12.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{border-color:var(--warn);background:var(--warn-bg)}
.banner .bx{min-width:0;overflow-wrap:break-word}
.wsteps{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.wsteps .st{width:27px;height:27px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;background:#fff}
.wsteps .st.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.wsteps .st.done{border-color:var(--accent);color:var(--accent)}
.wsteps .lk{margin:0 1px}
.wtitle{font-family:var(--serif);font-size:17px;font-weight:600;margin:8px 0 2px}
.wnote{font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:10px 0}
.cmp>div{background:var(--panel);padding:8px 9px;font-size:12px;line-height:1.65;min-width:0;overflow-wrap:break-word;white-space:pre-wrap}
.cmp .h{background:var(--accent-weak);font-weight:700;white-space:normal}
.cmp .k{color:var(--ink-3);font-size:10.5px;display:block;white-space:normal}
.catgrid{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
@media(min-width:520px){.catgrid{grid-template-columns:1fr 1fr}}
.catcard{border:1px solid var(--rule);background:#fff;padding:9px 10px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.catcard b{display:block;font-size:13px}
.catcard span{font-size:11px;color:var(--ink-2);line-height:1.5;display:block}
.catcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent)}
.hintbox{border-left:3px solid var(--accent);background:var(--accent-weak);padding:8px 10px;font-size:12.5px;margin:8px 0}
.kv{margin:7px 0;border-bottom:1px dotted var(--rule-2);padding-bottom:6px}
.kv:last-child{border-bottom:none}
.kv .k{font-size:10.5px;color:var(--ink-3)}
.kv .v{font-size:13px;white-space:pre-wrap;overflow-wrap:break-word}
.kv .v .none{color:var(--ink-3)}
pre.export{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--rule);
  padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;max-height:55vh;overflow-y:auto;margin:8px 0}
.srow{display:grid;grid-template-columns:66px 40px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--rule-2);font-size:12px}
.srow .bin{font-family:var(--mono);font-size:11px}
.srow .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.bars{display:grid;gap:3px}
.bar{height:9px;background:#E7ECE7;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.bar.conf i{background:var(--ink-3)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:8px 0}
.stat3>div{background:var(--panel);padding:8px 4px;text-align:center}
.stat3 b{font-family:var(--mono);font-size:16px;display:block}
.stat3 span{font-size:9.5px;color:var(--ink-2);line-height:1.4;display:block}
.mrow{display:grid;grid-template-columns:9em 28px 1fr;gap:6px;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dotted var(--rule-2)}
.mrow .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px}
.mmlist{margin:4px 0 0;padding:0;list-style:none}
.mmlist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--rule-2);font-size:12.5px}
.mmlist li .x{border:1px solid var(--rule);background:#fff;color:var(--ink-3);cursor:pointer;font-size:11px;padding:4px 8px}
.derived{border:1px dashed var(--rule);background:#fff;padding:8px 10px;font-size:12.5px;min-height:20px}
.derived .none{color:var(--ink-3)}
.overlay{position:fixed;inset:0;background:rgba(23,37,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
@media(min-width:520px){.overlay{align-items:center;padding:20px}}
.sheet{background:var(--panel);border:1px solid var(--rule);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:16px 16px 20px}
.sheet-h{font-family:var(--serif);font-size:15px;font-weight:600;border-bottom:1px solid var(--rule-2);padding-bottom:8px;margin-bottom:10px}
.treeq{font-size:13.5px;line-height:1.8;margin:8px 0}
.treeopts{display:grid;gap:8px;margin:10px 0}
.treeopts .btn{text-align:left;background:#fff;color:var(--ink);border-color:var(--rule);line-height:1.6}
.treeopts .btn:hover{border-color:var(--accent);background:var(--accent-weak)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);
  border-top:2px solid var(--ink);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:transparent;font-family:var(--sans);font-size:13px;
  color:var(--ink-2);padding:8px 4px;min-height:56px;cursor:pointer}
nav.bottom button[aria-current="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
body.wizard nav.bottom{display:none}
/* ウィザードの操作バーを下部固定にして常時親指圏に（片手入力対応）。アプリナビとは同時に出ない */
.wizbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--ink);z-index:30;
  display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.wizbar .btn.next{flex:1;min-width:0}
body.wizard .wrap{padding-bottom:170px}
.quickbox{border:1px dashed var(--rule);background:#fff;padding:2px 10px 10px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:13px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.linkline{overflow-wrap:anywhere;font-size:12.5px}
.editlog{font-size:11px;color:var(--ink-3);margin:4px 0 0;padding-left:1.2em}
footer{font-size:11px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:10px;margin-top:20px;line-height:1.8;overflow-wrap:break-word}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
noscript{display:block;padding:14px;border:1px solid var(--pos);color:var(--pos);background:#fff;margin:14px}
</style>
</head>

/* ---------------------------------------------------------------- utils */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nowISO() { return new Date().toISOString(); }
function p2(n) { return String(n).padStart(2, "0"); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function fmtDT(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}
function fmtD(iso) { return fmtDT(iso).slice(0, 10); }
function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function clampInt(v, a, b) { v = Math.round(Number(v) || 0); return Math.max(a, Math.min(b, v)); }
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ---------------------------------------------------------------- storage */
const K_META = "awn.meta", K_QUICK = "awn.quick", K_DRAFT = "awn.draft", K_SETTINGS = "awn.settings", K_CASE = "awn.case.";
function lsGet(k, fb) { try { const s = localStorage.getItem(k); return s == null ? fb : JSON.parse(s); } catch (e) { return fb; } }
function lsSet(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function initMeta() {
  const m = lsGet(K_META, null);

  else if ((m.schemaVersion || 1) > 1) { toast("新しい版で作られたデータです。アプリを更新してください。"); }
}

/* schema: 1症例1キー。checks は 1=あり / -1=なし / キー欠落=未評価 */
function newCase() {
  const t = nowISO();
  return {
    id: uid(),
    schemaVersion: 1,
    createdAt: t,
    updatedAt: t,
    status: "draft",            // draft → locked → reviewed
    wizardStep: 1,
    question: "", disease: "", age: "", sex: "",
    pre: { firstDx: "", conf: 50, altDx: "", site: { sides: [], aspects: [], ics: [], free: "" }, rationale: "" },
    exam: { checks: {}, freeText: "", missingExpectedManual: [], limitations: "" },
    lock: null,                 // {lockedAt, snapshot:{question,disease,age,sex,pre,exam}}
    pocus: { checks: {}, findings: "", confirmed: "", refuted: "", conf: null, newSuspicion: "" },
    compare: { hit: "", miss: "", missPrimary: "", missSecondary: "", nextAction: "", teachingPoint: "" },
    outcome: { ct: "", tests: "", finalDx: "", gapHours: "", match: "pending" },
    addenda: [],               // 補記（画像後・append-only）: [{at, text}]
    editedAfterLock: false,
    editLog: []
  };
}
function newQuickNote(date, zure, next) {
  return { id: "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    date: date || todayStr(), zure: zure || "", next: next || "", createdAt: nowISO() };
}
/* migrate chain（v1 が現行。未知フィールドは触らず温存する） */
function migrateCase(c) {
  if (!c || typeof c !== "object" || !c.id) return null;
  if (!c.schemaVersion) c.schemaVersion = 1;
  if (!c.status) c.status = "draft";
  if (!c.pre) c.pre = { firstDx: "", conf: 50, altDx: "", site: null, rationale: "" };
  if (typeof c.pre.conf !== "number") c.pre.conf = 50;
  if (!c.pre.site) c.pre.site = { sides: [], aspects: [], ics: [], free: "" };
  ["sides", "aspects", "ics"].forEach(k => { if (!Array.isArray(c.pre.site[k])) c.pre.site[k] = []; });
  if (!c.exam) c.exam = {};
  if (!c.exam.checks) c.exam.checks = {};
  if (!Array.isArray(c.exam.missingExpectedManual)) c.exam.missingExpectedManual = [];
  if (!c.pocus) c.pocus = {};
  if (!c.pocus.checks) c.pocus.checks = {};
  if (!c.compare) c.compare = {};
  if (!c.outcome) c.outcome = {};
  if (!c.outcome.match) c.outcome.match = "pending";
  if (!Array.isArray(c.addenda)) c.addenda = [];   // additive（schemaVersion 1 のまま）
  if (!Array.isArray(c.editLog)) c.editLog = [];
  return c;
}
function loadCaseById(id) { const c = lsGet(K_CASE + id, null); return c ? migrateCase(c) : null; }
function allCases() {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf(K_CASE) === 0) {
      const c = lsGet(k, null);
      const m = c && migrateCase(c);
      if (m) out.push(m);
    }
  }
  return out;
}

/* debounce 300ms 保存 + pagehide/画面遷移で flush */
let saveTimer = null, pendingCase = null;
function scheduleSave(c) {
  pendingCase = c;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
}
function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (pendingCase) { const c = pendingCase; pendingCase = null; persistCase(c); }
}
function persistCase(c) {
  try {
    localStorage.setItem(K_CASE + c.id, JSON.stringify(c));
    if (c === wizCase) {
      const ptr = lsGet(K_DRAFT, null);
      if (c.status !== "reviewed") lsSet(K_DRAFT, { caseId: c.id });
      else if (ptr && ptr.caseId === c.id) localStorage.removeItem(K_DRAFT);
    }
  } catch (e) {
    toast("保存に失敗しました（端末の空き容量を確認してください）");
  }
}
addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });

/* ------------------------------------------------- ロック規律（本アプリの核心） */
/* locked 以降、S1（問い・病態・年代・性別）/ pre / exam への書き込みは editAfterLock 経由のみ */
const LOCK_PROTECTED = ["s1", "pre", "exam"];
const editSession = Object.create(null);   // caseId -> Set(section) このセッションで訂正解錠済み
function sectionUnlocked(id, section) { return !!(editSession[id] && editSession[id].has(section)); }
function canWriteSection(c, section) {
  if (LOCK_PROTECTED.indexOf(section) < 0) return true;
  if (c.status === "draft") return true;
  return sectionUnlocked(c.id, section);
}
function writeCase(c, section, mutate) {
  if (!canWriteSection(c, section)) {
    toast("ロック済みの項目です。「訂正する」から開いてください。");
    return false;
  }
  mutate(c);
  c.updatedAt = nowISO();
  scheduleSave(c);
  return true;
}
function editAfterLock(c, section) {
  const names = { s1: "問い・病態", pre: stripNo(ET[2].heading), exam: stripNo(ET[3].heading) };
  const ok = confirm("ロック後の訂正です（対象：" + (names[section] || section) + "）。\n「" +
    UI.edited_after_lock_badge + "」の表示がこの記録に付き、外せません。訂正を始めますか？");
  if (!ok) return false;
  c.editedAfterLock = true;   // 不可逆
  c.editLog.push({ at: nowISO(), section: section });
  if (!editSession[c.id]) editSession[c.id] = new Set();
  editSession[c.id].add(section);
  c.updatedAt = nowISO();
  persistCase(c);
  return true;
}
/* 補記（画像後）: append-only。追記の関数しか存在せず、編集・削除の経路を作らない。
   snapshot・採点・集計・「画像後修正あり」バッジには一切影響しない */
function addAddendum(c, text) {
  const t = String(text == null ? "" : text).trim();
  if (!t) return false;
  c.addenda.push({ at: nowISO(), text: t });
  c.updatedAt = nowISO();
  persistCase(c);
  return true;
}
function lockCase(c) {
  if (c.status !== "draft" || c.lock) return false;
  c.lock = {
    lockedAt: nowISO(),
    snapshot: deepCopy({ question: c.question, disease: c.disease, age: c.age, sex: c.sex, pre: c.pre, exam: c.exam })
  };
  c.status = "locked";
  if (c.pocus.conf == null) c.pocus.conf = c.pre.conf;
  c.updatedAt = nowISO();
  persistCase(c);
  return true;
}

/* ---------------------------------------------------------------- 導出 */
function derivedMissing(exam, diseaseId) {
  const d = D_BY_ID[diseaseId];
  if (!d) return [];
  return (d.exam_items || []).filter(it => exam.checks[it.id] === -1).map(it => it.label);
}
function checkedLabels(items, checks, val) {
  return (items || []).filter(it => checks[it.id] === val).map(it => it.label);
}
function snapOf(c) {
  return c.lock ? c.lock.snapshot :
    { question: c.question, disease: c.disease, age: c.age, sex: c.sex, pre: c.pre, exam: c.exam };
}
function confMove(c) {
  const a = snapOf(c).pre.conf;
  const b = (c.pocus && c.pocus.conf != null) ? c.pocus.conf : a;
  const d = b - a;
  const arrow = d > 0 ? ("↑" + d) : d < 0 ? ("↓" + (-d)) : "±0";
  return { from: a, to: b, diff: d, arrow: arrow, text: a + "% → " + b + "%（" + arrow + "）" };
}
function fmtSite(site) {
  if (!site) return "";
  const parts = [].concat(site.sides || [], site.aspects || [], site.ics || []).join("・");
  const free = (site.free || "").trim();
  return parts && free ? parts + "／" + free : (parts || free);
}
function matchScore(m) { return m === "yes" ? 100 : m === "partial" ? 50 : m === "no" ? 0 : null; }
/* ---- ワンハンド入力の組み立て（規則の正本は content.yaml の quick_templates） ---- */
function sideOf(c) { return (c.pre.site.sides || []).length === 1 ? c.pre.site.sides[0] : ""; }
function assembleQuestion(tpl, side) {
  const slot = QT.side_slot || "◯";
  return String(tpl).split(slot).join(side || "");
}
/* 問いがテンプレ由来（どの側でも）なら、その素のテンプレを返す。手書きなら null */
function matchTemplate(q, diseaseId) {
  if (!q) return null;
  const tpls = (QT.questions || {})[diseaseId] || [];
  const sides = [""].concat(SITE.sides);
  for (let i = 0; i < tpls.length; i++)
    for (let j = 0; j < sides.length; j++)
      if (q === assembleQuestion(tpls[i], sides[j])) return tpls[i];
  return null;
}
function firstDxSuggestions(diseaseId, side) {
  if (!diseaseId || diseaseId === "other" || !D_BY_ID[diseaseId]) return [];
  const label = diseaseLabel(diseaseId);
  const out = [];
  (QT.first_dx_patterns || []).forEach(p => {
    if (p.indexOf("{side}") >= 0 && !side) return;
    const t = p.split("{side}").join(side || "").split("{label}").join(label).trim();
    if (t && out.indexOf(t) < 0) out.push(t);
  });
  return out;
}
/* POCUS 前後の確信度移動（プラン§6: 絶対値平均＋上下件数）。
   基準は snapshot の確信度（未ロックなら現行値）。pocus.conf 入力済みの記録のみ対象。
   符号付き平均だと ± が打ち消し合い「動かなかった」ように読めるので使わない。±0 は件数に数えない */
function statsMove(cases) {
  const moves = cases.filter(c => c.pocus && c.pocus.conf != null)
    .map(c => c.pocus.conf - snapOf(c).pre.conf);
  return {
    n: moves.length,
    absMean: moves.length ? moves.reduce((s, m) => s + Math.abs(m), 0) / moves.length : null,
    up: moves.filter(m => m > 0).length,
    down: moves.filter(m => m < 0).length
  };
}
function isUnfinished(c) { return c.status !== "reviewed"; }
function statusBadge(c) {
  if (c.status === "draft") return '<span class="badge b-draft">下書き（S' + (c.wizardStep || 1) + '）</span>';
  if (c.status === "locked") return '<span class="badge b-locked">ロック済み（S' + (c.wizardStep || 5) + '）</span>';
  return '<span class="badge b-rev">振り返り済み</span>';
}
function editedBadge(c) {
  return c.editedAfterLock ? '<span class="badge b-edit">' + esc(UI.edited_after_lock_badge) + "</span>" : "";
}
function matchBadge(c) {
  const m = c.outcome && c.outcome.match;
  if (!m || m === "pending") return "";
  return '<span class="badge b-out">一致判定：' + esc(MATCH_LABEL[m] || m) + "</span>";
}

/* ---------------------------------------------------------------- 書き出し */
function valOr(v) { const s = String(v == null ? "" : v).trim(); return s || "（未記入）"; }
function indentML(v) { return valOr(v).replace(/\n/g, "\n  "); }
function buildExportText(c) {
  const snap = snapOf(c);
  const d = D_BY_ID[snap.disease];
  const L = [];
  L.push("※ " + UI.anon_placeholder);
  L.push("");
  L.push("記録ID: " + c.id);
  L.push("ロック時刻: " + (c.lock ? fmtDT(c.lock.lockedAt) : "（未ロック）"));
  L.push("画像後修正: " + (c.editedAfterLock ? "あり（" + UI.edited_after_lock_badge + "）" : "なし"));
  L.push("");
  ET_ITEMS.forEach(item => {
    const no = item["no"];
    L.push("■ " + item.heading);
    if (no === 0) {
      const who = [diseaseLabel(snap.disease) || "（病態未選択）", snap.age, snap.sex].filter(Boolean).join("・");
      L.push("  " + c.id + " / " + who);
    } else if (no === 1) {
      L.push("  " + indentML(snap.question));
    } else if (no === 2) {
      const sf = item.subfields;
      L.push("  - " + sf[0] + ": " + indentML(snap.pre.firstDx));
      L.push("  - " + sf[1] + ": " + snap.pre.conf + "%");
      L.push("  - " + sf[2] + ": " + indentML(snap.pre.altDx));
      L.push("  - " + sf[3] + ": " + indentML(fmtSite(snap.pre.site)));
      L.push("  - " + sf[4] + ": " + indentML(snap.pre.rationale));
    } else if (no === 3) {
      const sf = item.subfields;
      const items = d ? d.exam_items : [];
      const pos = checkedLabels(items, snap.exam.checks, 1);
      const missing = derivedMissing(snap.exam, snap.disease).concat(snap.exam.missingExpectedManual || []);
      L.push("  - " + sf[0] + ": " + valOr(pos.join("、")));
      L.push("  - " + sf[1] + ": " + valOr(missing.join("、")));
      L.push("  - " + sf[2] + ": " + indentML(snap.exam.freeText));
      L.push("  - " + sf[3] + ": " + indentML(snap.exam.limitations));
    } else if (no === 4) {
      const sf = item.subfields;
      const items = d ? d.pocus_items : [];
      const pos = checkedLabels(items, c.pocus.checks, 1);
      const neg = checkedLabels(items, c.pocus.checks, -1);
      let f = pos.length ? "あり：" + pos.join("、") : "";
      if (neg.length) f += (f ? "／" : "") + "なし：" + neg.join("、");
      const free = (c.pocus.findings || "").trim();
      if (free) f += (f ? "\n" : "") + free;
      L.push("  - " + sf[0] + ": " + indentML(f));
      L.push("  - " + sf[1] + ": " + indentML(c.pocus.confirmed));
      L.push("  - " + sf[2] + ": " + indentML(c.pocus.refuted));
      L.push("  - " + sf[3] + ": " + (c.lock ? confMove(c).text : "（未ロック）"));
      L.push("  - " + sf[4] + ": " + indentML(c.pocus.newSuspicion));
    } else if (no === 5) {
      const sf = item.subfields;
      L.push("  - " + sf[0] + ": " + indentML(c.outcome.ct));
      L.push("  - " + sf[1] + ": " + indentML(c.outcome.tests));
      L.push("  - " + sf[2] + ": " + indentML(c.outcome.finalDx));
      L.push("  - " + sf[3] + ": " + (String(c.outcome.gapHours || "").trim() ? c.outcome.gapHours + "時間" : "（未記入）"));
      L.push("  - 一致判定: " + (MATCH_LABEL[c.outcome.match] || "未確定"));
    } else if (no === 6) {
      const sf = item.subfields;
      L.push("  - " + sf[0] + ": " + indentML(c.compare.hit));
      L.push("  - " + sf[1] + ": " + indentML(c.compare.miss));
      let cl = c.compare.missPrimary ? "主：" + (CAT_BY_ID[c.compare.missPrimary] || {}).label : "";
      if (c.compare.missSecondary) cl += (cl ? "／" : "") + "副：" + (CAT_BY_ID[c.compare.missSecondary] || {}).label;
      L.push("  - " + sf[2] + ": " + valOr(cl));
      L.push("  - " + sf[3] + ": " + indentML(c.compare.nextAction));
    } else if (no === 7) {
      const sf = item.subfields;
      L.push("  - " + sf[0] + ": " + indentML(c.compare.teachingPoint));
    }
    L.push("");
  });
  /* 補記（画像後）は末尾に別ブロックで。ヘッダの「画像後修正」とは独立（採点に使わない文章） */
  if ((c.addenda || []).length) {
    L.push("■ 補記（画像後）");
    c.addenda.forEach(a => { L.push("  - " + fmtDT(a.at) + ": " + indentML(a.text)); });
    L.push("");
  }
  return L.join("\n").replace(/\n+$/, "\n");
}
async function copyText(text) {

/* 決定木モーダル（CONTENT.miss_classification.tree の汎用レンダラ） */
function openTreeModal(onPick) {
  const tree = CONTENT.miss_classification.tree;
  const nodes = {}; tree.nodes.forEach(n => { nodes[n.id] = n; });
  let cur = tree.root;
  const hist = [];
  function draw() {
    const n = nodes[cur];
    if (!n) { closeModal(); return; }
    const root = openModal('<div class="sheet-h">分類に迷ったら、順に答える</div>' +
      '<p class="treeq">' + esc(n.text) + "</p>" +
      '<div class="treeopts">' + n.options.map((o, i) =>
        '<button type="button" class="btn opt" data-i="' + i + '">' + esc(o.label) + "</button>").join("") + "</div>" +
      '<div class="btnrow split"><span>' +
      (hist.length ? '<button type="button" class="btn ghost small" id="treeBack">ひとつ戻る</button>' : "") +
      '</span><button type="button" class="btn ghost small" data-close>閉じる</button></div>');
    $$(".opt", root).forEach(b => b.addEventListener("click", () => {
      const o = n.options[+b.dataset.i];
      if (o.next) { hist.push(cur); cur = o.next; draw(); }
      else if (o.result) { closeModal(); onPick(o.result); }
    }));
    const bk = $("#treeBack", root);
    if (bk) bk.addEventListener("click", () => { cur = hist.pop(); draw(); });
  }
  draw();
}

/* ---------------------------------------------------------------- router */
let prevRoute = null;

let wizStep = 1;
let wizardIntent = null; // {caseId, step} 一覧・詳細からの遷移指定
function nav(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}
function route() {
  flushSave();
  const h = location.hash || "#list";
  if (prevRoute === "#new" && h !== "#new" && wizCase && caseIsBlank(wizCase)) wizCase = null;
  const m = h.match(/^#case\/(.+)$/);
  document.body.classList.toggle("wizard", h === "#new");
  if (h === "#new") renderWizard();
  else if (m) renderDetail(m[1]);
  else if (h === "#stats") renderStats();
  else if (h === "#settings") renderSettings();
  else renderList();
  updateBottomNav(h);
  prevRoute = h;
  window.scrollTo(0, 0);
}
function updateBottomNav(h) {
  $$("#bottomnav button").forEach(b => {
    const on = b.dataset.nav === h || (b.dataset.nav === "#list" && h.indexOf("#case/") === 0);
    b.setAttribute("aria-current", on ? "true" : "false");
  });
}
$$("#bottomnav button").forEach(b => b.addEventListener("click", () => nav(b.dataset.nav)));
function caseIsBlank(c) {
  return !c.question && !c.disease && !c.pre.firstDx && Object.keys(c.exam.checks).length === 0;
}

function chipsField(o) {

function bindChips(name, c, section, apply) {

function bindConf(idBase, c, section, apply, onChange) {

          (c.age ? "・" + esc(c.age) : "") + (c.sex ? "・" + esc(c.sex) : "") + "</div>" +
          '<div class="t">' + esc(c.question || "（問い未入力）") + "</div>" +

    wizardIntent = null;
  }
  if (wizCase && !caseIsBlank(wizCase) && wizCase.id && !lsGet(K_CASE + wizCase.id, null) && wizCase.status !== "draft") {
    wizCase = null; // 復元・全消去などで消えた case を掴んでいた
  }
  if (!wizCase) {
    const ptr = lsGet(K_DRAFT, null);
    const pc = ptr && ptr.caseId ? loadCaseById(ptr.caseId) : null;
    if (pc && isUnfinished(pc)) { renderResumeChooser(pc); return; }
    wizCase = newCase(); wizStep = 1;
  }
  wizStep = Math.min(Math.max(wizStep, 1), 7);
  drawWizardStep();
}
function renderResumeChooser(pc) {
  $("#app").innerHTML = pageHeader("書きかけの記録があります") +
    '<div class="panel"><h2>どちらで始めますか</h2>' +
    '<p class="note">書きかけ：' + esc(diseaseLabel(pc.disease) || pc.question || "（未入力）") +
    "（S" + (pc.wizardStep || 1) + "・" + esc(fmtDT(pc.updatedAt)) + " 保存）</p>" +
    '<div class="btnrow"><button type="button" class="btn" id="rcResume" style="flex:1">続きから再開</button>' +
    '<button type="button" class="btn ghost" id="rcNew">新しく始める（書きかけは一覧に残る）</button></div>' +
    '<div class="btnrow"><button type="button" class="btn ghost small" id="rcBack">一覧へ戻る</button></div></div>';
  $("#rcResume").addEventListener("click", () => { wizCase = pc; wizStep = pc.wizardStep || 1; drawWizardStep(); });
  $("#rcNew").addEventListener("click", () => { wizCase = newCase(); wizStep = 1; drawWizardStep(); });
  $("#rcBack").addEventListener("click", () => nav("#list"));
}
const STEP_TITLES = { 1: "問いと病態", 2: "", 3: "", 4: "ロック", 5: "POCUS 答え合わせ", 6: "対比と外れ方", 7: "書き出しと完了" };
function stepTitle(n) {
  if (n === 2) return stripNo(ET[2].heading);
  if (n === 3) return stripNo(ET[3].heading);
  return STEP_TITLES[n];
}
function wizHeaderHTML() {
  const c = wizCase;
  let steps = "";
  for (let i = 1; i <= 7; i++) {
    steps += '<span class="st' + (i === wizStep ? " cur" : (i < wizStep ? " done" : "")) + '">' + i + "</span>";
    if (i === 4) steps += '<span class="lk">🔒</span>';
  }
  return '<div class="wsteps">' + steps + "</div>" +
    '<div class="wtitle">S' + wizStep + "　" + esc(stepTitle(wizStep)) + "</div>" +
    '<div class="wnote">' + (wizStep <= 4 ? "画像を開く前に書く" : "画像のあと") +
    (c.lock ? "　／　ロック " + esc(fmtDT(c.lock.lockedAt)) : "") + " " + editedBadge(c) + "</div>";
}
function drawWizardStep() {
  const c = wizCase;
  if (c.wizardStep !== wizStep) {
    c.wizardStep = wizStep;
    if (!caseIsBlank(c)) { c.updatedAt = nowISO(); scheduleSave(c); }
  }
  let body = "", bind = null;
  if (wizStep === 1) { const r = stepS1(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 2) { const r = stepS2(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 3) { const r = stepS3(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 4) { const r = stepS4(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 5) { const r = stepS5(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 6) { const r = stepS6(c); body = r[0]; bind = r[1]; }
  else { const r = stepS7(c); body = r[0]; bind = r[1]; }

  const nextLabel = wizStep === 4 ? (c.lock ? "次へ（S5 POCUS）" : "") :
    wizStep === 7 ? "" : "次へ（S" + (wizStep + 1) + "）";
  /* 操作バーは下部固定（.wizbar）。次へ を最大幅にして親指圏に置く */
  $("#app").innerHTML =
    '<div class="panel">' + wizHeaderHTML() + "</div>" +
    '<div class="panel">' + body + "</div>" +
    '<div class="wizbar">' +
    '<button type="button" class="btn ghost" id="wzBack"' + (wizStep === 1 ? " disabled" : "") + ">戻る</button>" +
    '<button type="button" class="btn ghost" id="wzLeave">一覧へ</button>' +
    (nextLabel ? '<button type="button" class="btn next" id="wzNext">' + nextLabel + "</button>" : '<span style="flex:1"></span>') +
    "</div>";
  if (bind) bind();
  $("#wzBack").addEventListener("click", () => { if (wizStep > 1) { wizStep--; drawWizardStep(); window.scrollTo(0, 0); } });
  $("#wzLeave").addEventListener("click", () => {
    flushSave();
    if (caseIsBlank(c)) wizCase = null;
    nav("#list");
  });
  const nx = $("#wzNext");
  if (nx) nx.addEventListener("click", () => {
    if (wizStep === 1 && (!c.question.trim() || !c.disease)) { toast("検証する問いと病態は必須です"); return; }
    if (wizStep === 6 && !c.compare.missPrimary) { toast("外れ方の分類（主）をひとつ選んでください"); return; }
    wizStep++;
    drawWizardStep(); window.scrollTo(0, 0);
  });
  window.scrollTo(0, 0);
}
function lockedBanner(c, section) {
  if (canWriteSection(c, section)) return "";
  return '<div class="banner warn"><span class="bx">ロック済み ── 画像前の記録は固定されています。' +
    "訂正すると「" + esc(UI.edited_after_lock_badge) + "」が付きます。</span>" +
    '<button type="button" class="btn small line" data-unlock="' + section + '">訂正する</button></div>';
}
function bindUnlock(c) {
  $$("[data-unlock]").forEach(b => b.addEventListener("click", () => {
    if (editAfterLock(c, b.dataset.unlock)) drawWizardStep();
  }));
}

/* ---- S1 問いと病態（病態→側→テンプレのタップだけで問いが入る） ---- */
function stepS1(c) {
  const dis = !canWriteSection(c, "s1");
  const preDis = !canWriteSection(c, "pre");
  const tpls = (QT.questions || {})[c.disease] || [];
  const showQuick = !dis && !preDis && tpls.length > 0;
  const curSide = sideOf(c);
  let quick = "";
  if (showQuick) {
    quick = '<div class="quickbox">' +
      chipsField({ label: "側（タップで問いと予測部位に入る）", name: "s1side", options: SITE.sides, selected: c.pre.site.sides, single: true }) +
      '<div class="field"><label>問いのテンプレ（タップで転記・あとから自由に編集できる）</label><div class="chips" id="tplChips">' +
      tpls.map((t, i) => '<button type="button" class="chip" data-tpl="' + i + '" aria-pressed="' +
        (c.question === assembleQuestion(t, curSide)) + '">' + esc(assembleQuestion(t, curSide)) + "</button>").join("") +
      "</div></div></div>";
  }
  const html = lockedBanner(c, "s1") +
    '<p class="subnote">※ ' + esc(UI.anon_placeholder) + "</p>" +
    '<p class="subnote">' + esc(UI.quick_hint) + "</p>" +
    chipsField({ label: "病態（必須）", name: "disease", options: DISEASES.map(d => d.label), selected: c.disease ? [diseaseLabel(c.disease)] : [], single: true, disabled: dis }) +
    quick +
    fieldText({ id: "f_q", label: stripNo(ET[1].heading) + "（必須）", value: c.question, ph: ET[1].example || "", multiline: true, rows: 2, disabled: dis }) +
    '<div class="field"><label for="f_age">年代（任意）</label><select id="f_age"' + (dis ? " disabled" : "") + '><option value="">未選択</option>' +
    AGES.map(a => '<option value="' + a + '"' + (c.age === a ? " selected" : "") + ">" + a + "</option>").join("") + "</select></div>" +
    '<div class="field"><label for="f_sex">性別（任意）</label><select id="f_sex"' + (dis ? " disabled" : "") + '><option value="">未選択</option>' +
    SEXES.map(a => '<option value="' + a + '"' + (c.sex === a ? " selected" : "") + ">" + a + "</option>").join("") + "</select></div>";
  return [html, function bind() {
    bindUnlock(c);
    bindText("#f_q", c, "s1", (cc, v) => { cc.question = v; });
    const diseaseBox = bindChips("disease", c, "s1", (cc, label) => {
      const d = DISEASES.find(x => x.label === label);
      const id = d ? d.id : "";
      if (cc.disease && cc.disease !== id &&
        (Object.keys(cc.exam.checks).length || Object.keys(cc.pocus.checks).length)) {
        if (!confirm("病態を変えると、チェックリストの入力（あり/なし）は消えます。よろしいですか？")) {
          drawWizardStep(); return;
        }
        cc.exam.checks = {}; cc.pocus.checks = {};
      }
      cc.disease = id;
    });
    if (diseaseBox) diseaseBox._after = () => drawWizardStep();  // テンプレブロックを出す
    if (showQuick) {
      // 側チップ: 単一選択で予測部位（pre.site.sides）へ。問いがテンプレ由来なら側も差し替える
      $$('.chips[data-name="s1side"] .chip').forEach(b => b.addEventListener("click", () => {
        const v = b.dataset.v;
        writeCase(c, "pre", cc => { cc.pre.site.sides = [v]; });
        const t = matchTemplate(c.question, c.disease);
        if (t) writeCase(c, "s1", cc => { cc.question = assembleQuestion(t, v); });
        drawWizardStep();
      }));
      // 問いテンプレ: タップで転記（手書きの問いは確認してから置換）
      $$("#tplChips .chip").forEach(b => b.addEventListener("click", () => {
        const t = tpls[+b.dataset.tpl];
        const text = assembleQuestion(t, sideOf(c));
        if (c.question.trim() && !matchTemplate(c.question, c.disease) && c.question !== text) {
          if (!confirm("いまの問いを置き換えます。よろしいですか？")) return;
        }
        writeCase(c, "s1", cc => { cc.question = text; });
        drawWizardStep();
      }));
    }
    const ageEl = $("#f_age"), sexEl = $("#f_sex");
    if (ageEl && !ageEl.disabled) ageEl.addEventListener("change", () => writeCase(c, "s1", cc => { cc.age = ageEl.value; }));
    if (sexEl && !sexEl.disabled) sexEl.addEventListener("change", () => writeCase(c, "s1", cc => { cc.sex = sexEl.value; }));
  }];
}

/* ---- S2 画像前の予測（サジェスト＋確信度プリセットで片手高速化） ---- */
const CONF_PRESETS = [30, 40, 50, 60, 70, 80, 90];
function stepS2(c) {
  const dis = !canWriteSection(c, "pre");
  const sf = ET[2].subfields;
  const sugs = dis ? [] : firstDxSuggestions(c.disease, sideOf(c));
  const html = lockedBanner(c, "pre") +
    fieldText({ id: "f_first", label: sf[0], value: c.pre.firstDx, ph: "", disabled: dis }) +
    (sugs.length ? '<div class="chips" id="dxSugs" style="margin:-6px 0 10px">' +
      sugs.map(s => '<button type="button" class="chip" data-s="' + esc(s) + '" aria-pressed="' + (c.pre.firstDx === s) + '">' +
        esc(s) + "</button>").join("") + "</div>" : "") +
    confField({ idBase: "cf1", label: sf[1], value: c.pre.conf, disabled: dis }) +
    (dis ? "" : '<div class="chips" id="confPresets" style="margin:-6px 0 10px">' +
      CONF_PRESETS.map(p => '<button type="button" class="chip" data-p="' + p + '" aria-pressed="' + (c.pre.conf === p) + '">' +
        p + "</button>").join("") + "</div>") +
    fieldText({ id: "f_alt", label: sf[2], value: c.pre.altDx, ph: "", disabled: dis }) +
    '<div class="field"><label>' + esc(sf[3]) + "</label></div>" +
    chipsField({ label: "左右", name: "sides", options: SITE.sides, selected: c.pre.site.sides, disabled: dis }) +
    chipsField({ label: "面", name: "aspects", options: SITE.aspects, selected: c.pre.site.aspects, disabled: dis }) +
    chipsField({ label: "高さ（肋間）", name: "ics", options: SITE.ics_chips, selected: c.pre.site.ics, disabled: dis }) +
    fieldText({ id: "f_sitefree", label: "部位の自由記載", value: c.pre.site.free, ph: "", disabled: dis }) +
    fieldText({ id: "f_rat", label: sf[4], value: c.pre.rationale, multiline: true, rows: 3, disabled: dis });
  return [html, function bind() {
    bindUnlock(c);
    bindText("#f_first", c, "pre", (cc, v) => { cc.pre.firstDx = v; });
    const syncPresets = v => $$("#confPresets .chip").forEach(x =>
      x.setAttribute("aria-pressed", +x.dataset.p === v ? "true" : "false"));
    bindConf("cf1", c, "pre", (cc, v) => { cc.pre.conf = v; }, syncPresets);
    // 第一候補サジェスト（病態ラベル＋側の組み立て。タップで入力・そのまま編集可）
    $$("#dxSugs .chip").forEach(b => b.addEventListener("click", () => {
      if (!writeCase(c, "pre", cc => { cc.pre.firstDx = b.dataset.s; })) return;
      $("#f_first").value = b.dataset.s;
      $$("#dxSugs .chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    }));
    // 確信度プリセット（タップ即設定。スライダー・数値も連動）
    $$("#confPresets .chip").forEach(b => b.addEventListener("click", () => {
      const p = +b.dataset.p;
      if (!writeCase(c, "pre", cc => { cc.pre.conf = p; })) return;
      $("#cf1r").value = p; $("#cf1n").value = p; $("#cf1v").textContent = p + "%";
      syncPresets(p);
    }));
    bindText("#f_alt", c, "pre", (cc, v) => { cc.pre.altDx = v; });
    bindChips("sides", c, "pre", (cc, v) => { toggleArr(cc.pre.site.sides, v); });
    bindChips("aspects", c, "pre", (cc, v) => { toggleArr(cc.pre.site.aspects, v); });
    bindChips("ics", c, "pre", (cc, v) => { toggleArr(cc.pre.site.ics, v); });
    bindText("#f_sitefree", c, "pre", (cc, v) => { cc.pre.site.free = v; });
    bindText("#f_rat", c, "pre", (cc, v) => { cc.pre.rationale = v; });
  }];
}
function toggleArr(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

/* ---- S3 身体診察 ---- */
function groupedExamItems(d) {
  const order = [], map = {};
  (d.exam_items || []).forEach(it => {
    const g = it.group || "";
    if (!map[g]) { map[g] = []; order.push(g); }
    map[g].push(it);
  });
  order.forEach(g => map[g].sort((a, b) => Number(!!b.priority) - Number(!!a.priority)));
  return order.map(g => ({ group: g, items: map[g] }));
}
function triRowHTML(it, val, dis) {
  const d = dis ? " disabled" : "";
  return '<div class="fnd"><div class="nm">' + (it.priority ? '<span class="pri">★</span>' : "") + esc(it.label) +
    (it.note ? '<div class="meta">' + esc(it.note) + "</div>" : "") + "</div>" +
    '<div class="tri" data-id="' + esc(it.id) + '">' +
    '<button type="button" class="pos" aria-pressed="' + (val === 1) + '"' + d + ">あり</button>" +
    '<button type="button" class="neg" aria-pressed="' + (val === -1) + '"' + d + ">なし</button>" +
    '<button type="button" class="non" aria-pressed="' + (val !== 1 && val !== -1) + '"' + d + ">未評価</button>" +
    "</div></div>";
}
function bindTriList(rootSel, c, section, checksOf, after) {
  $$(rootSel + " .tri").forEach(t => t.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const id = t.dataset.id;
    const val = b.classList.contains("pos") ? 1 : b.classList.contains("neg") ? -1 : 0;
    const ok = writeCase(c, section, cc => {
      const checks = checksOf(cc);
      if (val === 0) delete checks[id]; else checks[id] = val;
    });
    if (!ok) return;
    $$("button", t).forEach(x => x.setAttribute("aria-pressed",
      (val === 1 && x.classList.contains("pos")) || (val === -1 && x.classList.contains("neg")) ||
      (val === 0 && x.classList.contains("non")) ? "true" : "false"));
    if (after) after();
  }));
}
function derivedBoxHTML(c) {
  const list = derivedMissing(c.exam, c.disease);
  return list.length ? list.map(esc).join("、") : '<span class="none">（「なし」と判定した所見がここに自動で並ぶ・保存はされない）</span>';
}
function stepS3(c) {
  const dis = !canWriteSection(c, "exam");
  const d = D_BY_ID[c.disease];
  const sf = ET[3].subfields;
  let html = lockedBanner(c, "exam");
  if (!d) {
    html += '<p class="note">S1 で病態を選ぶと、その病態のチェックリストが出ます。</p>';
  } else if (!(d.exam_items || []).length) {
    html += '<p class="note">「' + esc(d.label) + "」はチェックリストなし。自由記載で記録します。</p>";
  } else {
    html += '<p class="subnote">チェックリスト（' + esc(d.label) + "）　★＝まず探す所見　各項目 あり／なし／未評価（既定＝未評価）</p>";
    groupedExamItems(d).forEach(g => {
      html += '<div class="cat">' + esc(g.group) + "</div>" +
        g.items.map(it => triRowHTML(it, c.exam.checks[it.id], dis)).join("");
    });
    if (d.integration_note) html += '<div class="hintbox">' + esc(d.integration_note) + "</div>";
  }
  html += fieldText({ id: "f_exfree", label: sf[2], value: c.exam.freeText, multiline: true, rows: 3, disabled: dis }) +
    '<div class="field"><label>' + esc(sf[1]) + '</label><div class="derived" id="derivedBox">' + derivedBoxHTML(c) + "</div>" +
    '<ul class="mmlist" id="mmList">' + mmListHTML(c, dis) + "</ul>" +
    (dis ? "" : '<div class="addrow"><input type="text" id="mmInput" placeholder="手動で追加（自動導出に無いもの）">' +
      '<button type="button" class="btn ghost small" id="mmAdd">追加</button></div>') +
    "</div>" +
    fieldText({ id: "f_limit", label: sf[3], value: c.exam.limitations, multiline: true, rows: 2, disabled: dis });
  return [html, function bind() {
    bindUnlock(c);
    bindTriList("#app", c, "exam", cc => cc.exam.checks, () => { $("#derivedBox").innerHTML = derivedBoxHTML(c); });
    bindText("#f_exfree", c, "exam", (cc, v) => { cc.exam.freeText = v; });
    bindText("#f_limit", c, "exam", (cc, v) => { cc.exam.limitations = v; });
    const add = $("#mmAdd");
    if (add) add.addEventListener("click", () => {
      const inp = $("#mmInput");
      const v = inp.value.trim();
      if (!v) return;
      if (writeCase(c, "exam", cc => cc.exam.missingExpectedManual.push(v))) {
        inp.value = ""; $("#mmList").innerHTML = mmListHTML(c, false); bindMMDel(c);
      }
    });
    bindMMDel(c);
  }];
}
function mmListHTML(c, dis) {
  return (c.exam.missingExpectedManual || []).map((v, i) =>
    "<li><span>" + esc(v) + "</span>" +
    (dis ? "" : '<button type="button" class="x" data-mm="' + i + '">削除</button>') + "</li>").join("");
}
function bindMMDel(c) {
  $$("[data-mm]").forEach(b => b.addEventListener("click", () => {
    if (writeCase(c, "exam", cc => cc.exam.missingExpectedManual.splice(+b.dataset.mm, 1))) {
      $("#mmList").innerHTML = mmListHTML(c, false); bindMMDel(c);
    }
  }));
}

/* ---- S4 ロック ---- */
function stepS4(c) {
  const d = D_BY_ID[c.disease];
  const pos = d ? checkedLabels(d.exam_items, c.exam.checks, 1) : [];
  const neg = d ? checkedLabels(d.exam_items, c.exam.checks, -1) : [];
  let html = "";
  if (c.lock) {
    html += '<div class="lockbox"><div class="big">ロック済み ── ' + esc(fmtDT(c.lock.lockedAt)) + "</div>" +
      '<p class="note">画像前の記録は固定されました。以降の訂正には「' + esc(UI.edited_after_lock_badge) + "」が付きます。</p></div>";
  } else {
    html += '<div class="lockbox"><div class="big">エコーを当てる前に、ここで固定する</div>' +
      '<p class="note">' + esc(UI.lock_confirm) + "</p>" +
      '<button type="button" class="btn lockbtn" id="lockBtn">🔒 ' + esc(UI.lock_button) + "</button></div>";
  }
  html += "<h2>ここまでの記録</h2>" +
    kvRow(stripNo(ET[1].heading), c.question) +
    kvRow("病態", diseaseLabel(c.disease)) +
    kvRow(ET[2].subfields[0] + "／" + ET[2].subfields[1], (c.pre.firstDx || "（未記入）") + "／" + c.pre.conf + "%") +
    kvRow(ET[2].subfields[3], fmtSite(c.pre.site)) +
    kvRow("あり と判定", pos.join("、")) +
    kvRow("なし と判定", neg.join("、")) +
    kvRow(ET[3].subfields[3], c.exam.limitations);
  return [html, function bind() {
    const b = $("#lockBtn");
    if (b) b.addEventListener("click", () => {
      if (!c.question.trim() || !c.disease) { toast("S1 の問いと病態が必須です"); wizStep = 1; drawWizardStep(); return; }
      if (!confirm(UI.lock_confirm)) return;
      flushSave();
      if (lockCase(c)) { toast("ロックしました。ここから先が画像です。"); wizStep = 5; drawWizardStep(); }
    });
  }];
}

/* ---- S5 POCUS ---- */
function stepS5(c) {
  const d = D_BY_ID[c.disease];
  const sf = ET[4].subfields;
  if (!c.lock) {
    return ['<p class="note">まだロックされていません。S4 でロックしてから POCUS へ進んでください。</p>', null];
  }
  let html = "";
  if (d && d.next_step_note) html += '<div class="hintbox">' + esc(d.next_step_note) + "</div>";
  if (d && (d.pocus_items || []).length) {
    html += '<p class="subnote">見る所見（' + esc(d.label) + "）</p>" +
      d.pocus_items.map(it => triRowHTML(it, c.pocus.checks[it.id], false)).join("");
  } else if (d) {
    html += '<p class="note">「' + esc(d.label) + "」は所見リストなし。自由記載で記録します。</p>";
  }
  html += fieldText({ id: "f_pofind", label: sf[0] + "と位置（自由記載）", value: c.pocus.findings, multiline: true, rows: 3 }) +
    fieldText({ id: "f_poconf", label: sf[1], value: c.pocus.confirmed, multiline: true, rows: 2 }) +
    fieldText({ id: "f_poref", label: sf[2], value: c.pocus.refuted, multiline: true, rows: 2 }) +
    confField({ idBase: "cf2", label: "POCUS 後の確信度（%）", value: c.pocus.conf != null ? c.pocus.conf : snapOf(c).pre.conf }) +
    '<div class="field"><label>' + esc(sf[3]) + '</label><div class="derived" id="moveBox">' + esc(confMove(c).text) + "</div></div>" +
    fieldText({ id: "f_ponew", label: sf[4], value: c.pocus.newSuspicion, multiline: true, rows: 2 });
  return [html, function bind() {
    bindTriList("#app", c, "pocus", cc => cc.pocus.checks, null);
    bindText("#f_pofind", c, "pocus", (cc, v) => { cc.pocus.findings = v; });
    bindText("#f_poconf", c, "pocus", (cc, v) => { cc.pocus.confirmed = v; });
    bindText("#f_poref", c, "pocus", (cc, v) => { cc.pocus.refuted = v; });
    bindConf("cf2", c, "pocus", (cc, v) => { cc.pocus.conf = v; }, () => { $("#moveBox").textContent = confMove(c).text; });
    bindText("#f_ponew", c, "pocus", (cc, v) => { cc.pocus.newSuspicion = v; });
  }];
}

/* ---- S6 対比と外れ方 ---- */
function compareHTML(c) {
  const snap = snapOf(c);
  const d = D_BY_ID[snap.disease];
  const posPre = d ? checkedLabels(d.exam_items, snap.exam.checks, 1) : [];
  const missing = derivedMissing(snap.exam, snap.disease).concat(snap.exam.missingExpectedManual || []);
  const posPo = d ? checkedLabels(d.pocus_items, c.pocus.checks, 1) : [];
  const negPo = d ? checkedLabels(d.pocus_items, c.pocus.checks, -1) : [];
  function cell(k, v) {
    const s = String(v == null ? "" : v).trim();
    return "<div><span class='k'>" + esc(k) + "</span>" + (s ? esc(s) : "<span class='k'>―</span>") + "</div>";
  }
  return '<div class="cmp">' +
    '<div class="h">画像前（ロック時点）</div><div class="h">POCUS 後</div>' +
    cell(ET[2].subfields[0], snap.pre.firstDx) + cell(ET[4].subfields[0], posPo.join("、") + (negPo.length ? (posPo.length ? "／" : "") + "なし：" + negPo.join("、") : "") + (c.pocus.findings ? "\n" + c.pocus.findings : "")) +
    cell(ET[2].subfields[1], snap.pre.conf + "%") + cell(ET[4].subfields[3], confMove(c).text) +
    cell(ET[2].subfields[3], fmtSite(snap.pre.site)) + cell(ET[4].subfields[1], c.pocus.confirmed) +
    cell(ET[3].subfields[0], posPre.join("、")) + cell(ET[4].subfields[2], c.pocus.refuted) +
    cell(ET[3].subfields[1], missing.join("、")) + cell(ET[4].subfields[4], c.pocus.newSuspicion) +
    "</div>";
}
function catCardsHTML(sel, dataAttr) {
  return '<div class="catgrid">' + CATS.map(cat =>
    '<button type="button" class="catcard" ' + dataAttr + '="' + cat.id + '" aria-pressed="' + (sel === cat.id) + '">' +
    "<b>" + esc(cat.label) + "</b><span>" + esc(cat.desc) + "</span></button>").join("") + "</div>";
}
function hintHTML(c) {
  const out = [];
  [c.compare.missPrimary, c.compare.missSecondary].forEach(id => {
    if (id && HINTS[id]) out.push("<b>" + esc((CAT_BY_ID[id] || {}).label) + "</b> → " + esc(HINTS[id]));
  });
  return out.length ? '<div class="hintbox">次の一手のヒント：<br>' + out.join("<br>") + "</div>" : '<div id="__nohint"></div>';
}
function stepS6(c) {
  if (!c.lock) return ['<p class="note">まだロックされていません。S4 でロックし、S5 の POCUS を先に記録してください。</p>', null];
  const sf = ET[6].subfields;
  const html = compareHTML(c) +
    fieldText({ id: "f_hit", label: sf[0], value: c.compare.hit, multiline: true, rows: 2 }) +
    fieldText({ id: "f_miss", label: sf[1], value: c.compare.miss, multiline: true, rows: 2 }) +
    '<div class="field"><label>' + esc(sf[2]) + '（主・必須）</label>' +
    '<div class="btnrow"><button type="button" class="btn line" id="treeBtn">分類に迷ったら ── 順に答えて辿る</button></div>' +
    '<div id="primCards">' + catCardsHTML(c.compare.missPrimary, "data-prim") + "</div></div>" +
    '<div class="field"><label>副分類（任意・もう1つあれば）</label>' +
    '<div id="secCards">' + catCardsHTML(c.compare.missSecondary, "data-sec") + "</div>" +
    '<div class="btnrow"><button type="button" class="btn ghost small" id="secClear">副分類を外す</button></div></div>' +
    '<div id="hintBox">' + hintHTML(c) + "</div>" +
    fieldText({ id: "f_next", label: sf[3], value: c.compare.nextAction, ph: "", multiline: false }) +
    '<h2 style="margin-top:14px">' + esc(stripNo(ET[7].heading)) + "</h2>" +
    fieldText({ id: "f_tp", label: UI.teaching_point_label, value: c.compare.teachingPoint, multiline: true, rows: 2 });
  return [html, function bind() {
    bindText("#f_hit", c, "compare", (cc, v) => { cc.compare.hit = v; });
    bindText("#f_miss", c, "compare", (cc, v) => { cc.compare.miss = v; });
    bindText("#f_next", c, "compare", (cc, v) => { cc.compare.nextAction = v; });
    bindText("#f_tp", c, "compare", (cc, v) => { cc.compare.teachingPoint = v; });
    function refreshCards() {
      $("#primCards").innerHTML = catCardsHTML(c.compare.missPrimary, "data-prim");
      $("#secCards").innerHTML = catCardsHTML(c.compare.missSecondary, "data-sec");
      $("#hintBox").innerHTML = hintHTML(c);
      bindCards();
    }
    function bindCards() {
      $$("[data-prim]").forEach(b => b.addEventListener("click", () => {
        writeCase(c, "compare", cc => { cc.compare.missPrimary = b.dataset.prim; });
        refreshCards();
      }));
      $$("[data-sec]").forEach(b => b.addEventListener("click", () => {
        writeCase(c, "compare", cc => { cc.compare.missSecondary = (cc.compare.missSecondary === b.dataset.sec ? "" : b.dataset.sec); });
        refreshCards();
      }));
    }
    bindCards();
    $("#treeBtn").addEventListener("click", () => openTreeModal(result => {
      writeCase(c, "compare", cc => { cc.compare.missPrimary = result; });
      refreshCards();
      toast("主分類：" + ((CAT_BY_ID[result] || {}).label || result));
    }));
    $("#secClear").addEventListener("click", () => {
      writeCase(c, "compare", cc => { cc.compare.missSecondary = ""; });
      refreshCards();
    });
  }];
}

/* ---- S7 書き出しと完了 ---- */
function stepS7(c) {
  const html = '<p class="note">巻末テンプレートの見出し順で書き出します。CT・最終診断は当日確定しないことが多いので、' +
    "後日この記録を一覧から開き「後日追記」（画像・検査・経過と一致判定）を埋めてください。一致判定を入れると集計に載ります。</p>" +
    '<pre class="export" id="expPre">' + esc(buildExportText(c)) + "</pre>" +
    '<div class="btnrow"><button type="button" class="btn line" id="expCopy">テキストをコピー</button>' +
    '<button type="button" class="btn" id="wzDone">完了（一覧へ）</button></div>';
  return [html, function bind() {
    $("#expCopy").addEventListener("click", () => copyText(buildExportText(c)));
    $("#wzDone").addEventListener("click", () => {
      if (c.status === "locked") c.status = "reviewed";
      c.wizardStep = 7;
      c.updatedAt = nowISO();
      persistCase(c);
      const ptr = lsGet(K_DRAFT, null);
      if (ptr && ptr.caseId === c.id) localStorage.removeItem(K_DRAFT);
      const id = c.id;
      wizCase = null;
      toast(c.status === "reviewed" ? "記録を閉じました。後日追記を忘れずに。" : "下書きのまま保存しました");
      nav("#case/" + id);
    });
  }];
}

/* ================================================================ #case/<id> */
function renderDetail(id) {
  const c = loadCaseById(id);
  if (!c) { toast("記録が見つかりません"); nav("#list"); return; }
  if (c.status === "draft") { wizardIntent = { caseId: c.id, step: c.wizardStep || 1 }; nav("#new"); return; }
  const d = D_BY_ID[c.disease];
  const sf2 = ET[2].subfields, sf3 = ET[3].subfields, sf4 = ET[4].subfields, sf5 = ET[5].subfields, sf6 = ET[6].subfields;
  let html = '<div class="btnrow" style="margin-top:0"><button type="button" class="btn ghost small" id="dBack">← 一覧</button></div>' +
    '<div class="panel"><h2>' + esc(diseaseLabel(c.disease) || "病態未選択") + "　" + esc(fmtD(c.createdAt)) + "</h2>" +
    "<div>" + statusBadge(c) + editedBadge(c) + matchBadge(c) + "</div>" +
    '<p class="subnote">記録ID ' + esc(c.id) + "　ロック " + esc(c.lock ? fmtDT(c.lock.lockedAt) : "―") + "</p>" +

  }
  /* 現在値の読み取り表示（訂正があれば current、画像前の採点は snapshot 側） */

    kvRow(stripNo(ET[1].heading), c.question) +

    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="s1" data-step="1">訂正する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[2].heading) + "</h2>" +
    kvRow(sf2[0], c.pre.firstDx) + kvRow(sf2[1], c.pre.conf + "%") + kvRow(sf2[2], c.pre.altDx) +
    kvRow(sf2[3], fmtSite(c.pre.site)) + kvRow(sf2[4], c.pre.rationale) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="pre" data-step="2">訂正する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[3].heading) + "</h2>" +
    kvRow(sf3[0], d ? checkedLabels(d.exam_items, c.exam.checks, 1).join("、") : "") +
    kvRow(sf3[1], derivedMissing(c.exam, c.disease).concat(c.exam.missingExpectedManual || []).join("、")) +
    kvRow(sf3[2], c.exam.freeText) + kvRow(sf3[3], c.exam.limitations) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="exam" data-step="3">訂正する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[4].heading) + "</h2>" +
    kvRow(sf4[0], (d ? checkedLabels(d.pocus_items, c.pocus.checks, 1).join("、") : "") + (c.pocus.findings ? "\n" + c.pocus.findings : "")) +
    kvRow(sf4[1], c.pocus.confirmed) + kvRow(sf4[2], c.pocus.refuted) +
    kvRow(sf4[3], c.lock ? confMove(c).text : "") + kvRow(sf4[4], c.pocus.newSuspicion) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-edit-step="5">編集する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[6].heading) + "・" + esc(stripNo(ET[7].heading)) + "</h2>" +

      (c.compare.missSecondary ? "／副：" + (CAT_BY_ID[c.compare.missSecondary] || {}).label : "")) +
    kvRow(sf6[3], c.compare.nextAction) + kvRow(UI.teaching_point_label, c.compare.teachingPoint) +

    chipsField({ label: "一致判定（予測と最終診断）", name: "match", options: ["はい", "部分", "いいえ", "未確定"], selected: [MATCH_LABEL[c.outcome.match] || "未確定"], single: true }) +
    '<p class="subnote">「はい／部分／いいえ」を選ぶと集計の対象になります。</p></div>';

      wizardIntent = { caseId: c.id, step: step };
      nav("#new");
    }
  }));
  $$("[data-edit-step]").forEach(b => b.addEventListener("click", () => {
    wizardIntent = { caseId: c.id, step: +b.dataset.editStep };
    nav("#new");
  }));
  bindText("#o_ct", c, "outcome", (cc, v) => { cc.outcome.ct = v; });
  bindText("#o_tests", c, "outcome", (cc, v) => { cc.outcome.tests = v; });
  bindText("#o_final", c, "outcome", (cc, v) => { cc.outcome.finalDx = v; });
  const gap = $("#o_gap");
  gap.addEventListener("input", () => writeCase(c, "outcome", cc => { cc.outcome.gapHours = gap.value; }));
  const M_REV = { "はい": "yes", "部分": "partial", "いいえ": "no", "未確定": "pending" };
  bindChips("match", c, "outcome", (cc, label) => { cc.outcome.match = M_REV[label] || "pending"; });
  $("#addAdx").addEventListener("click", () => openAddendumModal(c));
  $("#dCopy").addEventListener("click", () => copyText(buildExportText(c)));
}
/* 補記モーダル（append-only: 保存後の編集・削除UIは意図的に無い） */
function openAddendumModal(c) {
  const root = openModal('<div class="sheet-h">補記を足す（画像後）</div>' +
    '<p class="subnote">' + esc(UI.addendum_note) + "　保存後の編集・削除はできません。</p>" +
    '<textarea id="adxText" rows="4" placeholder="' + esc(UI.anon_placeholder) + '"></textarea>' +
    '<div class="btnrow split"><button type="button" class="btn ghost" data-close>閉じる</button>' +
    '<button type="button" class="btn" id="adxSave">保存する</button></div>');
  $("#adxSave", root).addEventListener("click", () => {
    if (addAddendum(c, $("#adxText").value)) { closeModal(); toast("補記を足しました"); renderDetail(c.id); }
    else toast("本文を入力してください");
  });
}

/* ================================================================ #stats */
function renderStats() {
  const all = allCases();
  const filter = renderStats._filter || "";
  const done = all.filter(c => c.lock && c.outcome && c.outcome.match && c.outcome.match !== "pending" &&
    (!filter || c.disease === filter));
  let html = pageHeader("集計 ── 一致判定（はい／部分／いいえ）が確定した記録だけを数える。") +
    '<div class="panel"><div class="field"><label for="stFilter">疾患フィルタ</label><select id="stFilter">' +
    '<option value="">すべての病態</option>' +
    DISEASES.map(d => '<option value="' + d.id + '"' + (filter === d.id ? " selected" : "") + ">" + esc(d.label) + "</option>").join("") +
    "</select></div>" +
    '<p class="note">対象：' + done.length + " 件（一致判定が確定した記録）</p>" +
    '<p class="subnote">うち「' + esc(UI.edited_after_lock_badge) + "」 " +
    done.filter(c => c.editedAfterLock).length + " 件</p>";

  if (done.length < 5) {
    html += '<div class="hintbox">' + esc(UI.small_n_note) + "</div></div>";
  } else {
    const rows = done.map(c => {
      const conf = snapOf(c).pre.conf;
      const score = matchScore(c.outcome.match);
      return { conf: conf, score: score, gap: conf - score, prim: c.compare.missPrimary || "" };
    });
    const mv = statsMove(done);
    const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
    const f1 = x => (x >= 0 ? "+" : "") + x.toFixed(1);
    html += '<div class="stat3">' +
      "<div><b>" + f1(mean(rows.map(r => r.gap))) + "</b><span>平均外れ幅<br>（確信度−的中）</span></div>" +
      "<div><b>" + mean(rows.map(r => Math.abs(r.gap))).toFixed(1) + "</b><span>平均絶対外れ幅</span></div>" +
      "<div><b>" + (mv.n ? mv.absMean.toFixed(1) : "―") + "</b><span>POCUS 前後の確信度移動<br>（絶対値平均）　↑" + mv.up + "件・↓" + mv.down + "件</span></div>" +
      "</div>" +
      '<p class="subnote">的中スコア：はい=100／部分=50／いいえ=0。外れ幅＝ロック時の確信度−的中スコア（＋は自信過剰方向）。' +
      '確信度移動＝POCUS 後の確信度−ロック時の確信度（POCUS 後の確信度を入力した記録のみ・±0 は件数に数えない）。</p>';
    /* 5ビン較正表 */
    const bins = [[0, 20], [21, 40], [41, 60], [61, 80], [81, 100]];
    html += "<h2>確信度と的中の較正表</h2>" +
      '<p class="subnote">上の棒（灰）＝そのビンの平均確信度、下の棒（緑）＝平均的中スコア。二本が揃うほど較正が良い。</p>' +
      bins.map(b => {
        const rs = rows.filter(r => r.conf >= b[0] && r.conf <= b[1]);
        const label = b[0] + "–" + b[1] + "%";
        if (!rs.length) return '<div class="srow"><span class="bin">' + label + '</span><span class="n">0件</span><span class="subnote">―</span></div>';
        const mc = mean(rs.map(r => r.conf)), ms = mean(rs.map(r => r.score));
        return '<div class="srow"><span class="bin">' + label + '</span><span class="n">' + rs.length + "件</span>" +
          '<span class="bars"><span class="bar conf"><i style="width:' + mc + '%"></i></span>' +
          '<span class="bar"><i style="width:' + ms + '%"></i></span></span></div>';
      }).join("");
    /* 外れ方8分類の内訳 */
    const counts = CATS.map(cat => ({ cat: cat, n: rows.filter(r => r.prim === cat.id).length }));
    const maxN = Math.max(1, Math.max.apply(null, counts.map(x => x.n)));
    html += '<h2 style="margin-top:14px">外れ方の分類（主）の内訳</h2>' +
      counts.map(x =>
        '<div class="mrow"><span>' + esc(x.cat.label) + '</span><span class="n">' + x.n + "</span>" +
        '<span class="bar"><i style="width:' + (x.n / maxN * 100) + '%"></i></span></div>').join("") +
      "</div>";
  }
  html += footerHTML();
  $("#app").innerHTML = html;
  $("#stFilter").addEventListener("change", e => { renderStats._filter = e.target.value; renderStats(); });
}

/* ================================================================ #settings */
function usageEstimate() {
  let chars = 0, cases = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("awn.") === 0) {
      chars += k.length + (localStorage.getItem(k) || "").length;
      if (k.indexOf(K_CASE) === 0) cases++;
    }
  }
  return { kb: (chars * 2 / 1024).toFixed(1), cases: cases };
}
function unbackedCount() {
  const s = lsGet(K_SETTINGS, {});
  const t = s.lastBackupAt || "";
  const cs = allCases().filter(c => !t || (c.updatedAt || "") > t).length;
  const qs = lsGet(K_QUICK, []).filter(q => !t || (q.createdAt || "") > t).length;
  return cs + qs;
}
function renderSettings() {
  const s = lsGet(K_SETTINGS, {});
  const u = usageEstimate();
  const html = pageHeader("設定 ── データはこの端末の中にしかない。だからバックアップする。") +
    '<div class="panel"><h2>バックアップ <small>BACKUP</small></h2>' +
    '<p class="note">全記録を JSON 1ファイルで書き出します。前回：' + (s.lastBackupAt ? esc(fmtDT(s.lastBackupAt)) : "未実施") +
    "／未バックアップ " + unbackedCount() + " 件</p>" +
    '<div class="btnrow"><button type="button" class="btn" id="bkBtn">JSON をダウンロード</button></div></div>' +
    '<div class="panel"><h2>復元 <small>RESTORE</small></h2>' +
    '<p class="note">バックアップ JSON を選ぶと、件数を確認してから「全置換」か「マージ」（同じ記録IDは更新の新しい方を残す）を選べます。</p>' +
    '<input type="file" id="rsFile" accept=".json,application/json"></div>' +
    '<div class="panel"><h2>データ <small>STORAGE</small></h2>' +
    '<p class="note">使用量（概算）：' + u.kb + " KB／症例 " + u.cases + " 件・一行記録 " + lsGet(K_QUICK, []).length + " 件</p>" +
    '<p class="note" id="persistState">端末へのデータ保持（persist）：確認中…</p>' +
    '<div class="btnrow"><button type="button" class="btn line" id="psBtn">端末にデータ保持を要求する</button>' +
    '<button type="button" class="btn danger" id="wipeBtn">全データを消去</button></div></div>' +
    '<div class="panel"><h2>参照 <small>REFERENCES</small></h2>' +
    '<p class="linkline">' + esc(CONTENT.links.bedside_bayes_note) + "：<br>" +
    '<a href="' + esc(CONTENT.links.bedside_bayes) + '" target="_blank" rel="noopener">' + esc(CONTENT.links.bedside_bayes) + "</a></p>" +
    '<p class="note">' + esc(CONTENT.links.guide_ref) + "<br>" + esc(CONTENT.links.nejm_ref) + "</p>" +
    '<p class="note">このアプリは診療の判断を代行しません。記録と較正のための教育ツールです。</p>' +
    '<p class="subnote">バージョン：' + esc(APP_VERSION) + "</p></div>" +
    footerHTML();
  $("#app").innerHTML = html;
  $("#bkBtn").addEventListener("click", doBackup);
  $("#rsFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { handleRestore(String(r.result)); e.target.value = ""; };
    r.readAsText(f);
  });
  $("#wipeBtn").addEventListener("click", () => {
    if (!confirm("全データ（症例・一行記録・設定）をこの端末から消去します。よろしいですか？")) return;
    if (!confirm("本当に消去しますか？ バックアップが無ければ元に戻せません。")) return;
    wipeAll();
    toast("消去しました");
    renderSettings();
  });
  const ps = $("#psBtn");
  refreshPersistState();
  ps.addEventListener("click", async () => {
    if (!(navigator.storage && navigator.storage.persist)) { toast("この環境では要求できません"); return; }
    const ok = await navigator.storage.persist();
    toast(ok ? "端末がデータ保持を受け付けました" : "受け付けられませんでした（ブックマーク追加やホーム画面追加で通りやすくなります）");
    refreshPersistState();
  });
}
async function refreshPersistState() {
  const el = $("#persistState");
  if (!el) return;
  if (navigator.storage && navigator.storage.persisted) {
    const p = await navigator.storage.persisted();
    el.textContent = "端末へのデータ保持（persist）：" + (p ? "有効" : "未設定（ブラウザ都合で消えることがあります）");
  } else {
    el.textContent = "端末へのデータ保持（persist）：この環境では確認できません";
  }
}
function doBackup() {
  const data = { app: "kotaeawase-note", schemaVersion: 1, exportedAt: nowISO(), cases: allCases(), quick: lsGet(K_QUICK, []) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kotaeawase-backup-" + todayStr().replace(/-/g, "") + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  const s = lsGet(K_SETTINGS, {});
  s.lastBackupAt = nowISO();
  try { lsSet(K_SETTINGS, s); } catch (e) {}
  toast("バックアップを書き出しました");
  renderSettings();
}
function handleRestore(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert("JSON として読めませんでした。"); return; }
  if (!data || data.app !== "kotaeawase-note" || !Array.isArray(data.cases)) {
    alert("このアプリのバックアップではありません（app 識別子が一致しません）。"); return;
  }
  if ((data.schemaVersion || 1) > 1) {
    alert("このバックアップは新しい版のものです。アプリを更新してから復元してください。"); return;
  }
  const cases = data.cases.map(migrateCase).filter(Boolean);
  const quick = Array.isArray(data.quick) ? data.quick.filter(q => q && q.id) : [];
  const cur = allCases();
  const root = openModal('<div class="sheet-h">復元の確認</div>' +
    '<p class="note">読み込み：症例 ' + cases.length + " 件・一行記録 " + quick.length + " 件<br>" +
    "現在：症例 " + cur.length + " 件・一行記録 " + lsGet(K_QUICK, []).length + " 件</p>" +
    '<div class="btnrow"><button type="button" class="btn danger" id="rsReplace">全置換（現在を消して読み込む）</button>' +
    '<button type="button" class="btn" id="rsMerge">マージ（同IDは新しい方）</button>' +
    '<button type="button" class="btn ghost" data-close>キャンセル</button></div>');
  $("#rsReplace", root).addEventListener("click", () => {
    if (!confirm("現在の全記録を消して、読み込んだ内容に置き換えます。よろしいですか？")) return;
    wipeAll();
    cases.forEach(c => { try { lsSet(K_CASE + c.id, c); } catch (e) {} });
    try { lsSet(K_QUICK, quick); } catch (e) {}
    finishRestore();
  });
  $("#rsMerge", root).addEventListener("click", () => {
    const byId = {};
    cur.forEach(c => { byId[c.id] = c; });
    cases.forEach(c => {
      const ex = byId[c.id];
      if (!ex || (c.updatedAt || "") > (ex.updatedAt || "")) byId[c.id] = c;
    });
    Object.keys(byId).forEach(id => { try { lsSet(K_CASE + id, byId[id]); } catch (e) {} });
    const qCur = lsGet(K_QUICK, []);
    const qIds = {}; qCur.forEach(q => { qIds[q.id] = true; });
    quick.forEach(q => { if (!qIds[q.id]) qCur.push(q); });
    try { lsSet(K_QUICK, qCur); } catch (e) {}
    finishRestore();
  });
  function finishRestore() {
    wizCase = null; wizardIntent = null;
    localStorage.removeItem(K_DRAFT);
    closeModal();
    toast("復元しました");
    renderSettings();
  }
}
function wipeAll() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("awn.") === 0) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  wizCase = null; wizardIntent = null; pendingCase = null;
  initMeta();
}

/* ---------------------------------------------------------------- bootstrap */
initMeta();
route();
addEventListener("hashchange", route);
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>

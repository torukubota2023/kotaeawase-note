/* ================================================================ #new（ウィザード S1〜S7） */
function renderWizard() {
  if (wizardIntent && wizardIntent.fresh) {
    /* ＋新規（下部ナビ・一覧ボタン）: 常に新しい記録から。下書きの再開は #list の再開バナー・
       一覧の行タップ・（直接 #new を開いたときの）チューザーが従来どおり担う */
    wizardIntent = null;
    wizCase = newCase();
    wizStep = 1;
    drawWizardStep();
    return;
  }
  if (wizardIntent) {
    const c = loadCaseById(wizardIntent.caseId);
    if (c) { wizCase = c; wizStep = wizardIntent.step || c.wizardStep || 1; }
    wizardIntent = null;
  }
  if (wizCase && !caseIsBlank(wizCase) && wizCase.id && !lsGet(K_CASE + wizCase.id, null) && wizCase.status !== "draft") {
    wizCase = null; // 復元・全消去などで消えた case を掴んでいた
  }
  if (!wizCase) {
    const ptr = lsGet(K_DRAFT, null);
    const pc = ptr && ptr.caseId ? loadCaseById(ptr.caseId) : null;
    if (pc && isUnfinished(pc)) { renderResumeChooser(pc); return; }
    wizCase = newCase(); wizStep = 1;
  }
  wizStep = Math.min(Math.max(wizStep, 1), 7);
  drawWizardStep();
}
function renderResumeChooser(pc) {
  $("#app").innerHTML = pageHeader("書きかけの記録があります") +
    '<div class="panel"><h2>どちらで始めますか</h2>' +
    '<p class="note">書きかけ：' + esc(diseaseLabel(pc.disease) || pc.question || "（未入力）") +
    "（S" + (pc.wizardStep || 1) + "・" + esc(fmtDT(pc.updatedAt)) + " 保存）</p>" +
    '<div class="btnrow"><button type="button" class="btn" id="rcResume" style="flex:1">続きから再開</button>' +
    '<button type="button" class="btn ghost" id="rcNew">新しく始める（書きかけは一覧に残る）</button></div>' +
    '<div class="btnrow"><button type="button" class="btn ghost small" id="rcBack">一覧へ戻る</button></div></div>';
  $("#rcResume").addEventListener("click", () => { wizCase = pc; wizStep = pc.wizardStep || 1; drawWizardStep(); });
  $("#rcNew").addEventListener("click", () => { wizCase = newCase(); wizStep = 1; drawWizardStep(); });
  $("#rcBack").addEventListener("click", () => nav("#list"));
}
const STEP_TITLES = { 1: "問いと病態", 2: "", 3: "", 4: "ロック", 5: "POCUS 答え合わせ", 6: "対比と外れ方", 7: "書き出しと完了" };
function stepTitle(n) {
  if (n === 2) return stripNo(ET[2].heading);
  if (n === 3) return stripNo(ET[3].heading);
  return STEP_TITLES[n];
}
function wizHeaderHTML() {
  const c = wizCase;
  let steps = "";
  for (let i = 1; i <= 7; i++) {
    steps += '<span class="st' + (i === wizStep ? " cur" : (i < wizStep ? " done" : "")) + '">' + i + "</span>";
    if (i === 4) steps += '<span class="lk">🔒</span>';
  }
  return '<div class="wsteps">' + steps + "</div>" +
    '<div class="wtitle">S' + wizStep + "　" + esc(stepTitle(wizStep)) + "</div>" +
    '<div class="wnote">' + (wizStep <= 4 ? "画像を開く前に書く" : "画像のあと") +
    (c.lock ? "　／　ロック " + esc(fmtDT(c.lock.lockedAt)) : "") + " " + editedBadge(c) + "</div>";
}
function drawWizardStep() {
  const c = wizCase;
  if (c.wizardStep !== wizStep) {
    c.wizardStep = wizStep;
    if (!caseIsBlank(c)) { c.updatedAt = nowISO(); scheduleSave(c); }
  }
  let body = "", bind = null;
  if (wizStep === 1) { const r = stepS1(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 2) { const r = stepS2(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 3) { const r = stepS3(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 4) { const r = stepS4(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 5) { const r = stepS5(c); body = r[0]; bind = r[1]; }
  else if (wizStep === 6) { const r = stepS6(c); body = r[0]; bind = r[1]; }
  else { const r = stepS7(c); body = r[0]; bind = r[1]; }

  const nextLabel = wizStep === 4 ? (c.lock ? "次へ（S5 POCUS）" : "") :
    wizStep === 7 ? "" : "次へ（S" + (wizStep + 1) + "）";
  /* 操作バーは下部固定（.wizbar）。次へ を最大幅にして親指圏に置く */
  $("#app").innerHTML =
    '<div class="panel">' + wizHeaderHTML() + "</div>" +
    '<div class="panel">' + body + "</div>" +
    '<div class="wizbar">' +
    '<button type="button" class="btn ghost" id="wzBack"' + (wizStep === 1 ? " disabled" : "") + ">戻る</button>" +
    '<button type="button" class="btn ghost" id="wzLeave">一覧へ</button>' +
    (nextLabel ? '<button type="button" class="btn next" id="wzNext">' + nextLabel + "</button>" : '<span style="flex:1"></span>') +
    "</div>";
  if (bind) bind();
  $("#wzBack").addEventListener("click", () => { if (wizStep > 1) { wizStep--; drawWizardStep(); window.scrollTo(0, 0); } });
  $("#wzLeave").addEventListener("click", () => {
    flushSave();
    if (caseIsBlank(c)) wizCase = null;
    nav("#list");
  });
  const nx = $("#wzNext");
  if (nx) nx.addEventListener("click", () => {
    if (wizStep === 1 && (!c.question.trim() || !c.disease)) { toast("検証する問いと病態は必須です"); return; }
    if (wizStep === 6 && !s6CanProceed(c)) { toast("外れ方の分類（主）か「" + UI.no_miss_label + "」を選んでください"); return; }
    wizStep++;
    drawWizardStep(); window.scrollTo(0, 0);
  });
  window.scrollTo(0, 0);
}
function lockedBanner(c, section) {
  if (canWriteSection(c, section)) return "";
  return '<div class="banner warn"><span class="bx">ロック済み ── 画像前の記録は固定されています。' +
    "訂正すると「" + esc(UI.edited_after_lock_badge) + "」が付きます。</span>" +
    '<button type="button" class="btn small line" data-unlock="' + section + '">訂正する</button></div>';
}
function bindUnlock(c) {
  $$("[data-unlock]").forEach(b => b.addEventListener("click", () => {
    if (editAfterLock(c, b.dataset.unlock)) drawWizardStep();
  }));
}

/* ---- S1 問いと病態（病態→側→テンプレのタップだけで問いが入る） ---- */
function stepS1(c) {
  const dis = !canWriteSection(c, "s1");
  const preDis = !canWriteSection(c, "pre");
  const tpls = (QT.questions || {})[c.disease] || [];
  const showQuick = !dis && !preDis && tpls.length > 0;
  const curSide = sideOf(c);
  let quick = "";
  if (showQuick) {
    quick = '<div class="quickbox">' +
      chipsField({ label: "側（タップで問いと予測部位に入る）", name: "s1side", options: SITE.sides, selected: c.pre.site.sides, single: true }) +
      '<div class="field"><label>問いのテンプレ（タップで転記・あとから自由に編集できる）</label><div class="chips" id="tplChips">' +
      tpls.map((t, i) => '<button type="button" class="chip" data-tpl="' + i + '" aria-pressed="' +
        (c.question === assembleQuestion(t.text, curSide)) + '">' + esc(assembleQuestion(t.text, curSide)) + "</button>").join("") +
      "</div></div></div>";
  }
  const html = lockedBanner(c, "s1") +
    '<p class="subnote">※ ' + esc(UI.anon_placeholder) + "</p>" +
    '<p class="subnote">' + esc(UI.quick_hint) + "</p>" +
    chipsField({ label: "病態（必須）", name: "disease", options: DISEASES.map(d => d.label), selected: c.disease ? [diseaseLabel(c.disease)] : [], single: true, disabled: dis }) +
    quick +
    fieldText({ id: "f_q", label: stripNo(ET[1].heading) + "（必須）", value: c.question, ph: ET[1].example || "", multiline: true, rows: 2, disabled: dis }) +
    chipsField({ label: UI.qtype_label, name: "qtype", options: [UI.qtype_qual, UI.qtype_quant],
      selected: [c.qtype === "quant" ? UI.qtype_quant : UI.qtype_qual], single: true, disabled: dis }) +
    '<div class="field"><label for="f_age">年代（任意）</label><select id="f_age"' + (dis ? " disabled" : "") + '><option value="">未選択</option>' +
    AGES.map(a => '<option value="' + a + '"' + (c.age === a ? " selected" : "") + ">" + a + "</option>").join("") + "</select></div>" +
    '<div class="field"><label for="f_sex">性別（任意）</label><select id="f_sex"' + (dis ? " disabled" : "") + '><option value="">未選択</option>' +
    SEXES.map(a => '<option value="' + a + '"' + (c.sex === a ? " selected" : "") + ">" + a + "</option>").join("") + "</select></div>";
  return [html, function bind() {
    bindUnlock(c);
    bindText("#f_q", c, "s1", (cc, v) => { cc.question = v; });
    const diseaseBox = bindChips("disease", c, "s1", (cc, label) => {
      const d = DISEASES.find(x => x.label === label);
      const id = d ? d.id : "";
      if (cc.disease && cc.disease !== id &&
        (Object.keys(cc.exam.checks).length || Object.keys(cc.pocus.checks).length)) {
        if (!confirm("病態を変えると、チェックリストの入力（あり/なし）は消えます。よろしいですか？")) {
          drawWizardStep(); return;
        }
        cc.exam.checks = {}; cc.pocus.checks = {};
      }
      cc.disease = id;
    });
    if (diseaseBox) diseaseBox._after = () => drawWizardStep();  // テンプレブロックを出す
    // 問いの型（定性/定量）。テンプレ転記時はテンプレの qtype が入り、手書きはここで切り替える
    bindChips("qtype", c, "s1", (cc, label) => {
      cc.qtype = (label === UI.qtype_quant) ? "quant" : "qual";
    });
    if (showQuick) {
      // 側チップ: 単一選択で予測部位（pre.site.sides）へ。問いがテンプレ由来なら側も差し替える
      $$('.chips[data-name="s1side"] .chip').forEach(b => b.addEventListener("click", () => {
        const v = b.dataset.v;
        writeCase(c, "pre", cc => { cc.pre.site.sides = [v]; });
        const t = matchTemplate(c.question, c.disease);
        if (t) writeCase(c, "s1", cc => { cc.question = assembleQuestion(t.text, v); cc.qtype = normQtype(t.qtype); });
        drawWizardStep();
      }));
      // 問いテンプレ: タップで転記（手書きの問いは確認してから置換）。問いの型もテンプレに追随
      $$("#tplChips .chip").forEach(b => b.addEventListener("click", () => {
        const t = tpls[+b.dataset.tpl];
        const text = assembleQuestion(t.text, sideOf(c));
        if (c.question.trim() && !matchTemplate(c.question, c.disease) && c.question !== text) {
          if (!confirm("いまの問いを置き換えます。よろしいですか？")) return;
        }
        writeCase(c, "s1", cc => { cc.question = text; cc.qtype = normQtype(t.qtype); });
        drawWizardStep();
      }));
    }
    const ageEl = $("#f_age"), sexEl = $("#f_sex");
    if (ageEl && !ageEl.disabled) ageEl.addEventListener("change", () => writeCase(c, "s1", cc => { cc.age = ageEl.value; }));
    if (sexEl && !sexEl.disabled) sexEl.addEventListener("change", () => writeCase(c, "s1", cc => { cc.sex = sexEl.value; }));
  }];
}

/* ---- S2 画像前の予測（サジェスト＋確信度プリセットで片手高速化） ---- */
const CONF_PRESETS = [30, 40, 50, 60, 70, 80, 90];
function stepS2(c) {
  const dis = !canWriteSection(c, "pre");
  const sf = ET[2].subfields;
  const sugs = dis ? [] : firstDxSuggestions(c.disease, sideOf(c));
  const qp = c.pre.quantPred;
  const quantBlock = c.qtype !== "quant" ? "" :
    '<div class="field"><label for="f_qpred">' + esc(UI.quant_pred_label) + '</label>' +
    '<input type="number" id="f_qpred" step="0.5" inputmode="decimal" value="' +
    esc(qp && typeof qp.value === "number" ? qp.value : "") + '"' + (dis ? " disabled" : "") + "></div>" +
    chipsField({ label: UI.quant_unit_label, name: "qunit", options: QUANT_UNITS,
      selected: qp && qp.unit ? [qp.unit] : [], single: true, disabled: dis }) +
    howtoBlock(c);
  const html = lockedBanner(c, "pre") +
    fieldText({ id: "f_first", label: sf[0], value: c.pre.firstDx, ph: "", disabled: dis }) +
    (sugs.length ? '<div class="chips" id="dxSugs" style="margin:-6px 0 10px">' +
      sugs.map(s => '<button type="button" class="chip" data-s="' + esc(s) + '" aria-pressed="' + (c.pre.firstDx === s) + '">' +
        esc(s) + "</button>").join("") + "</div>" : "") +
    confField({ idBase: "cf1", label: sf[1], value: c.pre.conf, disabled: dis }) +
    (dis ? "" : '<div class="chips" id="confPresets" style="margin:-6px 0 10px">' +
      CONF_PRESETS.map(p => '<button type="button" class="chip" data-p="' + p + '" aria-pressed="' + (c.pre.conf === p) + '">' +
        p + "</button>").join("") + "</div>") +
    quantBlock +
    fieldText({ id: "f_alt", label: sf[2], value: c.pre.altDx, ph: "", disabled: dis }) +
    '<div class="field"><label>' + esc(sf[3]) + '</label><div class="sitepicker" id="sp-pre"></div></div>' +
    fieldText({ id: "f_rat", label: sf[4], value: c.pre.rationale, multiline: true, rows: 3, disabled: dis });
  return [html, function bind() {
    bindUnlock(c);
    bindText("#f_first", c, "pre", (cc, v) => { cc.pre.firstDx = v; });
    const syncPresets = v => $$("#confPresets .chip").forEach(x =>
      x.setAttribute("aria-pressed", +x.dataset.p === v ? "true" : "false"));
    bindConf("cf1", c, "pre", (cc, v) => { cc.pre.conf = v; }, syncPresets);
    // 第一候補サジェスト（病態ラベル＋側の組み立て。タップで入力・そのまま編集可）
    $$("#dxSugs .chip").forEach(b => b.addEventListener("click", () => {
      if (!writeCase(c, "pre", cc => { cc.pre.firstDx = b.dataset.s; })) return;
      $("#f_first").value = b.dataset.s;
      $$("#dxSugs .chip").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    }));
    // 確信度プリセット（タップ即設定。スライダー・数値も連動）
    $$("#confPresets .chip").forEach(b => b.addEventListener("click", () => {
      const p = +b.dataset.p;
      if (!writeCase(c, "pre", cc => { cc.pre.conf = p; })) return;
      $("#cf1r").value = p; $("#cf1n").value = p; $("#cf1v").textContent = p + "%";
      syncPresets(p);
    }));
    // 定量の予測値（pre 配下＝ロック保護・snapshot に入る）
    const qn = $("#f_qpred");
    if (qn && !qn.disabled) qn.addEventListener("input", () => {
      writeCase(c, "pre", cc => {
        if (!cc.pre.quantPred) cc.pre.quantPred = { value: null, unit: "" };
        cc.pre.quantPred.value = qn.value === "" ? null : Number(qn.value);
      });
    });
    bindChips("qunit", c, "pre", (cc, label) => {
      if (!cc.pre.quantPred) cc.pre.quantPred = { value: null, unit: "" };
      cc.pre.quantPred.unit = label;
    });
    bindText("#f_alt", c, "pre", (cc, v) => { cc.pre.altDx = v; });
    mountSitePicker($("#sp-pre"), {
      getSite: () => c.pre.site,
      write: fn => writeCase(c, "pre", cc => fn(cc.pre.site)),
      disabled: dis
    });
    bindText("#f_rat", c, "pre", (cc, v) => { cc.pre.rationale = v; });
  }];
}

/* ---- S3 身体診察 ---- */
function groupedExamItems(d) {
  const order = [], map = {};
  (d.exam_items || []).forEach(it => {
    const g = it.group || "";
    if (!map[g]) { map[g] = []; order.push(g); }
    map[g].push(it);
  });
  order.forEach(g => map[g].sort((a, b) => Number(!!b.priority) - Number(!!a.priority)));
  return order.map(g => ({ group: g, items: map[g] }));
}
function triRowHTML(it, val, dis) {
  const d = dis ? " disabled" : "";
  return '<div class="fnd"><div class="nm">' + (it.priority ? '<span class="pri">★</span>' : "") + esc(it.label) +
    (it.note ? '<div class="meta">' + esc(it.note) + "</div>" : "") + "</div>" +
    '<div class="tri" data-id="' + esc(it.id) + '">' +
    '<button type="button" class="pos" aria-pressed="' + (val === 1) + '"' + d + ">あり</button>" +
    '<button type="button" class="neg" aria-pressed="' + (val === -1) + '"' + d + ">なし</button>" +
    '<button type="button" class="non" aria-pressed="' + (val !== 1 && val !== -1) + '"' + d + ">未評価</button>" +
    "</div></div>";
}
function bindTriList(rootSel, c, section, checksOf, after) {
  $$(rootSel + " .tri").forEach(t => t.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const id = t.dataset.id;
    const val = b.classList.contains("pos") ? 1 : b.classList.contains("neg") ? -1 : 0;
    const ok = writeCase(c, section, cc => {
      const checks = checksOf(cc);
      if (val === 0) delete checks[id]; else checks[id] = val;
    });
    if (!ok) return;
    $$("button", t).forEach(x => x.setAttribute("aria-pressed",
      (val === 1 && x.classList.contains("pos")) || (val === -1 && x.classList.contains("neg")) ||
      (val === 0 && x.classList.contains("non")) ? "true" : "false"));
    if (after) after();
  }));
}
function derivedBoxHTML(c) {
  const list = derivedMissing(c.exam, c.disease);
  return list.length ? list.map(esc).join("、") : '<span class="none">（「なし」と判定した所見がここに自動で並ぶ・保存はされない）</span>';
}
function stepS3(c) {
  const dis = !canWriteSection(c, "exam");
  const d = D_BY_ID[c.disease];
  const sf = ET[3].subfields;
  let html = lockedBanner(c, "exam");
  if (!d) {
    html += '<p class="note">S1 で病態を選ぶと、その病態のチェックリストが出ます。</p>';
  } else if (!(d.exam_items || []).length) {
    html += '<p class="note">「' + esc(d.label) + "」はチェックリストなし。自由記載で記録します。</p>";
  } else {
    html += '<p class="subnote">チェックリスト（' + esc(d.label) + "）　★＝まず探す所見　各項目 あり／なし／未評価（既定＝未評価）</p>";
    groupedExamItems(d).forEach(g => {
      html += '<div class="cat">' + esc(g.group) + "</div>" +
        g.items.map(it => triRowHTML(it, c.exam.checks[it.id], dis)).join("");
    });
    if (d.integration_note) html += '<div class="hintbox">' + esc(d.integration_note) + "</div>";
  }
  html += fieldText({ id: "f_exfree", label: sf[2], value: c.exam.freeText, multiline: true, rows: 3, disabled: dis }) +
    '<div class="field"><label>' + esc(sf[1]) + '</label><div class="derived" id="derivedBox">' + derivedBoxHTML(c) + "</div>" +
    '<ul class="mmlist" id="mmList">' + mmListHTML(c, dis) + "</ul>" +
    (dis ? "" : '<div class="addrow"><input type="text" id="mmInput" placeholder="手動で追加（自動導出に無いもの）">' +
      '<button type="button" class="btn ghost small" id="mmAdd">追加</button></div>') +
    "</div>" +
    fieldText({ id: "f_limit", label: sf[3], value: c.exam.limitations, multiline: true, rows: 2, disabled: dis });
  return [html, function bind() {
    bindUnlock(c);
    bindTriList("#app", c, "exam", cc => cc.exam.checks, () => { $("#derivedBox").innerHTML = derivedBoxHTML(c); });
    bindText("#f_exfree", c, "exam", (cc, v) => { cc.exam.freeText = v; });
    bindText("#f_limit", c, "exam", (cc, v) => { cc.exam.limitations = v; });
    const add = $("#mmAdd");
    if (add) add.addEventListener("click", () => {
      const inp = $("#mmInput");
      const v = inp.value.trim();
      if (!v) return;
      if (writeCase(c, "exam", cc => cc.exam.missingExpectedManual.push(v))) {
        inp.value = ""; $("#mmList").innerHTML = mmListHTML(c, false); bindMMDel(c);
      }
    });
    bindMMDel(c);
  }];
}
function mmListHTML(c, dis) {
  return (c.exam.missingExpectedManual || []).map((v, i) =>
    "<li><span>" + esc(v) + "</span>" +
    (dis ? "" : '<button type="button" class="x" data-mm="' + i + '">削除</button>') + "</li>").join("");
}
function bindMMDel(c) {
  $$("[data-mm]").forEach(b => b.addEventListener("click", () => {
    if (writeCase(c, "exam", cc => cc.exam.missingExpectedManual.splice(+b.dataset.mm, 1))) {
      $("#mmList").innerHTML = mmListHTML(c, false); bindMMDel(c);
    }
  }));
}

/* ---- S4 ロック ---- */
function stepS4(c) {
  const d = D_BY_ID[c.disease];
  const pos = d ? checkedLabels(d.exam_items, c.exam.checks, 1) : [];
  const neg = d ? checkedLabels(d.exam_items, c.exam.checks, -1) : [];
  let html = "";
  if (c.lock) {
    html += '<div class="lockbox"><div class="big">ロック済み ── ' + esc(fmtDT(c.lock.lockedAt)) + "</div>" +
      '<p class="note">画像前の記録は固定されました。以降の訂正には「' + esc(UI.edited_after_lock_badge) + "」が付きます。</p></div>";
  } else {
    html += '<div class="lockbox"><div class="big">エコーを当てる前に、ここで固定する</div>' +
      '<p class="note">' + esc(UI.lock_confirm) + "</p>" +
      '<button type="button" class="btn lockbtn" id="lockBtn">🔒 ' + esc(UI.lock_button) + "</button></div>";
  }
  html += "<h2>ここまでの記録</h2>" +
    kvRow(stripNo(ET[1].heading), c.question) +
    kvRow("病態", diseaseLabel(c.disease)) +
    kvRow(ET[2].subfields[0] + "／" + ET[2].subfields[1], (c.pre.firstDx || "（未記入）") + "／" + c.pre.conf + "%") +
    (c.qtype === "quant" ? kvRow(UI.quant_pred_label, quantPredText(c.pre)) : "") +
    kvRow(ET[2].subfields[3], composeSite(c.pre.site)) +
    kvRow("あり と判定", pos.join("、")) +
    kvRow("なし と判定", neg.join("、")) +
    kvRow(ET[3].subfields[3], c.exam.limitations);
  return [html, function bind() {
    const b = $("#lockBtn");
    if (b) b.addEventListener("click", () => {
      if (!c.question.trim() || !c.disease) { toast("S1 の問いと病態が必須です"); wizStep = 1; drawWizardStep(); return; }
      if (!confirm(UI.lock_confirm)) return;
      flushSave();
      if (lockCase(c)) { toast("ロックしました。ここから先が画像です。"); wizStep = 5; drawWizardStep(); }
    });
  }];
}

/* ---- S5 POCUS ---- */
function stepS5(c) {
  const d = D_BY_ID[c.disease];
  const sf = ET[4].subfields;
  if (!c.lock) {
    return ['<p class="note">まだロックされていません。S4 でロックしてから POCUS へ進んでください。</p>', null];
  }
  let html = "";
  if (d && d.next_step_note) html += '<div class="hintbox">' + esc(d.next_step_note) + "</div>";
  if (d && (d.pocus_items || []).length) {
    html += '<p class="subnote">見る所見（' + esc(d.label) + "）</p>" +
      d.pocus_items.map(it => triRowHTML(it, c.pocus.checks[it.id], false)).join("");
  } else if (d) {
    html += '<p class="note">「' + esc(d.label) + "」は所見リストなし。自由記載で記録します。</p>";
  }
  html += '<div class="field"><label>位置（POCUS を当てた場所・複数可）</label>' +
    '<div class="chips" id="poPresets" style="margin:4px 0 8px">' +
    (SITE.pocus_presets || []).map((p, i) =>
      '<button type="button" class="chip" data-preset="' + i + '" title="' + esc(p.desc) + '">' + esc(p.label) + "</button>").join("") +
    "</div>" +
    '<div id="poSites"></div>' +
    '<div class="btnrow"><button type="button" class="btn ghost small" id="poAddSite">＋ 位置を追加</button></div></div>' +
    fieldText({ id: "f_pofind", label: sf[0] + "（自由記載）", value: c.pocus.findings, multiline: true, rows: 3 }) +
    fieldText({ id: "f_poconf", label: sf[1], value: c.pocus.confirmed, multiline: true, rows: 2 }) +
    fieldText({ id: "f_poref", label: sf[2], value: c.pocus.refuted, multiline: true, rows: 2 }) +
    confField({ idBase: "cf2", label: "POCUS 後の確信度（%）", value: c.pocus.conf != null ? c.pocus.conf : snapOf(c).pre.conf }) +
    '<div class="field"><label>' + esc(sf[3]) + '</label><div class="derived" id="moveBox">' + esc(confMove(c).text) + "</div></div>" +
    fieldText({ id: "f_ponew", label: sf[4], value: c.pocus.newSuspicion, multiline: true, rows: 2 });
  return [html, function bind() {
    bindTriList("#app", c, "pocus", cc => cc.pocus.checks, null);
    $$("#poPresets .chip").forEach(b => b.addEventListener("click", () => {
      const p = (SITE.pocus_presets || [])[+b.dataset.preset];
      if (!p) return;
      writeCase(c, "pocus", cc => { cc.pocus.sites.push(presetSite(p)); });
      s5OpenIdx = c.pocus.sites.length - 1;   // 側（右/左）を足せるよう開いておく
      mountPocusSites(c);
    }));
    const addBtn = $("#poAddSite");
    if (addBtn) addBtn.addEventListener("click", () => {
      writeCase(c, "pocus", cc => { cc.pocus.sites.push(newSite()); });
      s5OpenIdx = c.pocus.sites.length - 1;
      mountPocusSites(c);
    });
    mountPocusSites(c);
    bindText("#f_pofind", c, "pocus", (cc, v) => { cc.pocus.findings = v; });
    bindText("#f_poconf", c, "pocus", (cc, v) => { cc.pocus.confirmed = v; });
    bindText("#f_poref", c, "pocus", (cc, v) => { cc.pocus.refuted = v; });
    bindConf("cf2", c, "pocus", (cc, v) => { cc.pocus.conf = v; }, () => { $("#moveBox").textContent = confMove(c).text; });
    bindText("#f_ponew", c, "pocus", (cc, v) => { cc.pocus.newSuspicion = v; });
  }];
}

/* S5 の位置リスト（行＝組み立て文＋削除。開いた行にピッカーを差し込む） */
function mountPocusSites(c) {
  const box = $("#poSites");
  if (!box) return;
  const sites = c.pocus.sites || [];
  if (s5OpenIdx >= sites.length) s5OpenIdx = -1;
  box.innerHTML = sites.length ? sites.map((s, i) => {
    const open = i === s5OpenIdx;
    return '<div class="siterow"><div class="hd">' +
      '<button type="button" class="opentxt" data-site-open="' + i + '">' +
      (open ? "▾ " : "▸ ") + esc(composeSite(s) || "（未入力・タップして編集）") + "</button>" +
      '<button type="button" class="x" data-site-del="' + i + '">削除</button></div>' +
      (open ? '<div class="sitepicker" data-site-picker="' + i + '"></div>' : "") +
      "</div>";
  }).join("") : '<p class="subnote">BLUE プリセットか「＋ 位置を追加」で、当てた場所を記録できます</p>';
  $$("[data-site-open]", box).forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.siteOpen;
    s5OpenIdx = (s5OpenIdx === i ? -1 : i);
    mountPocusSites(c);
  }));
  $$("[data-site-del]", box).forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.siteDel;
    writeCase(c, "pocus", cc => { cc.pocus.sites.splice(i, 1); });
    if (s5OpenIdx === i) s5OpenIdx = -1; else if (s5OpenIdx > i) s5OpenIdx--;
    mountPocusSites(c);
  }));
  const pk = $("[data-site-picker]", box);
  if (pk && pk.dataset && pk.dataset.sitePicker !== undefined) {
    const idx = +pk.dataset.sitePicker;
    mountSitePicker(pk, {
      getSite: () => (c.pocus.sites || [])[idx],
      write: fn => writeCase(c, "pocus", cc => { const s = cc.pocus.sites[idx]; if (s) fn(s); }),
      disabled: false,
      onWrote: () => mountPocusSites(c)   // 行の組み立て文も追随させる
    });
  }
}

/* ---- S6 対比と外れ方 ---- */
function compareHTML(c) {
  const snap = snapOf(c);
  const d = D_BY_ID[snap.disease];
  const posPre = d ? checkedLabels(d.exam_items, snap.exam.checks, 1) : [];
  const missing = derivedMissing(snap.exam, snap.disease).concat(snap.exam.missingExpectedManual || []);
  const posPo = d ? checkedLabels(d.pocus_items, c.pocus.checks, 1) : [];
  const negPo = d ? checkedLabels(d.pocus_items, c.pocus.checks, -1) : [];
  function cell(k, v) {
    const s = String(v == null ? "" : v).trim();
    return "<div><span class='k'>" + esc(k) + "</span>" + (s ? esc(s) : "<span class='k'>―</span>") + "</div>";
  }
  const poSites = (c.pocus.sites || []).map(composeSite).filter(Boolean).join("\n");
  return '<div class="cmp">' +
    '<div class="h">画像前（ロック時点）</div><div class="h">POCUS 後</div>' +
    cell(ET[2].subfields[0], snap.pre.firstDx) + cell(ET[4].subfields[0], posPo.join("、") + (negPo.length ? (posPo.length ? "／" : "") + "なし：" + negPo.join("、") : "") + (c.pocus.findings ? "\n" + c.pocus.findings : "")) +
    cell(ET[2].subfields[1], snap.pre.conf + "%") + cell(ET[4].subfields[3], confMove(c).text) +
    cell(ET[2].subfields[3], composeSite(snap.pre.site)) + cell("位置（POCUS）", poSites) +
    cell(ET[3].subfields[0], posPre.join("、")) + cell(ET[4].subfields[1], c.pocus.confirmed) +
    cell(ET[3].subfields[1], missing.join("、")) + cell(ET[4].subfields[2], c.pocus.refuted) +
    cell(ET[2].subfields[4], snap.pre.rationale) + cell(ET[4].subfields[4], c.pocus.newSuspicion) +
    "</div>";
}
function catCardsHTML(sel, dataAttr) {
  return '<div class="catgrid">' + CATS.map(cat =>
    '<button type="button" class="catcard" ' + dataAttr + '="' + cat.id + '" aria-pressed="' + (sel === cat.id) + '">' +
    "<b>" + esc(cat.label) + "</b><span>" + esc(cat.desc) + "</span></button>").join("") + "</div>";
}
function hintHTML(c) {
  const out = [];
  [c.compare.missPrimary, c.compare.missSecondary].forEach(id => {
    if (id && HINTS[id]) out.push("<b>" + esc((CAT_BY_ID[id] || {}).label) + "</b> → " + esc(HINTS[id]));
  });
  return out.length ? '<div class="hintbox">次の一手のヒント：<br>' + out.join("<br>") + "</div>" : '<div id="__nohint"></div>';
}
/* 分類ブロック（主＝外れなし or 8分類。外れなし選択時は 決定木・副分類・ヒントを出さない。
   8分類カードは表示したままにして、タップでいつでも外れなしから切り替えられるようにする） */
function classBlockHTML(c) {
  const sf = ET[6].subfields;
  const isNone = c.compare.missPrimary === "none";
  let h = '<div class="field"><label>' + esc(sf[2]) + '（主・必須）</label>' +
    '<button type="button" class="nomiss" data-nomiss aria-pressed="' + isNone + '">' + esc(UI.no_miss_label) + "</button>" +
    (isNone ? "" :
      '<div class="btnrow" style="margin-top:8px"><button type="button" class="btn line" id="treeBtn">分類に迷ったら ── 順に答えて辿る</button></div>') +
    '<div id="primCards">' + catCardsHTML(isNone ? "" : c.compare.missPrimary, "data-prim") + "</div></div>";
  if (!isNone) {
    h += '<div class="field"><label>副分類（任意・もう1つあれば）</label>' +
      '<div id="secCards">' + catCardsHTML(c.compare.missSecondary, "data-sec") + "</div>" +
      '<div class="btnrow"><button type="button" class="btn ghost small" id="secClear">副分類を外す</button></div></div>' +
      '<div id="hintBox">' + hintHTML(c) + "</div>";
  }
  return h;
}
function stepS6(c) {
  if (!c.lock) return ['<p class="note">まだロックされていません。S4 でロックし、S5 の POCUS を先に記録してください。</p>', null];
  const sf = ET[6].subfields;
  const html = compareHTML(c) +
    fieldText({ id: "f_hit", label: sf[0], value: c.compare.hit, multiline: true, rows: 2 }) +
    fieldText({ id: "f_miss", label: sf[1], value: c.compare.miss, multiline: true, rows: 2 }) +
    '<div id="classBlock">' + classBlockHTML(c) + "</div>" +
    fieldText({ id: "f_next", label: sf[3], value: c.compare.nextAction, ph: "", multiline: false }) +
    '<h2 style="margin-top:14px">' + esc(stripNo(ET[7].heading)) + "</h2>" +
    fieldText({ id: "f_tp", label: UI.teaching_point_label, value: c.compare.teachingPoint, multiline: true, rows: 2 });
  return [html, function bind() {
    bindText("#f_hit", c, "compare", (cc, v) => { cc.compare.hit = v; });
    bindText("#f_miss", c, "compare", (cc, v) => { cc.compare.miss = v; });
    bindText("#f_next", c, "compare", (cc, v) => { cc.compare.nextAction = v; });
    bindText("#f_tp", c, "compare", (cc, v) => { cc.compare.teachingPoint = v; });
    function refreshClass() {
      $("#classBlock").innerHTML = classBlockHTML(c);
      bindClass();
    }
    function bindClass() {
      const nm = $("[data-nomiss]");
      if (nm) nm.addEventListener("click", () => {
        writeCase(c, "compare", cc => {
          if (cc.compare.missPrimary === "none") cc.compare.missPrimary = "";
          else { cc.compare.missPrimary = "none"; cc.compare.missSecondary = ""; }
        });
        refreshClass();
      });
      $$("[data-prim]").forEach(b => b.addEventListener("click", () => {
        writeCase(c, "compare", cc => { cc.compare.missPrimary = b.dataset.prim; });
        refreshClass();
      }));
      $$("[data-sec]").forEach(b => b.addEventListener("click", () => {
        writeCase(c, "compare", cc => { cc.compare.missSecondary = (cc.compare.missSecondary === b.dataset.sec ? "" : b.dataset.sec); });
        refreshClass();
      }));
      const tb = $("#treeBtn");
      if (tb) tb.addEventListener("click", () => openTreeModal(result => {
        writeCase(c, "compare", cc => { cc.compare.missPrimary = result; });
        refreshClass();
        toast("主分類：" + ((CAT_BY_ID[result] || {}).label || result));
      }));
      const scl = $("#secClear");
      if (scl) scl.addEventListener("click", () => {
        writeCase(c, "compare", cc => { cc.compare.missSecondary = ""; });
        refreshClass();
      });
    }
    bindClass();
  }];
}

/* ---- S7 書き出しと完了 ---- */
function stepS7(c) {
  const html = '<p class="note">巻末テンプレートの見出し順で書き出します。CT・最終診断は当日確定しないことが多いので、' +
    "後日この記録を一覧から開き「後日追記」（画像・検査・経過・一致判定・病態の有無）を埋めてください。" +
    "一致判定を入れると集計に、「" + esc(UI.disease_present_label) + "」を入れると「" + esc(UI.plr_title) + "」に載ります。</p>" +
    '<pre class="export" id="expPre">' + esc(buildExportText(c)) + "</pre>" +
    '<div class="btnrow"><button type="button" class="btn line" id="expCopy">テキストをコピー</button>' +
    '<button type="button" class="btn" id="wzDone">完了（一覧へ）</button></div>';
  return [html, function bind() {
    $("#expCopy").addEventListener("click", () => copyText(buildExportText(c)));
    $("#wzDone").addEventListener("click", () => {
      if (c.status === "locked") c.status = "reviewed";
      c.wizardStep = 7;
      c.updatedAt = nowISO();
      persistCase(c);
      const ptr = lsGet(K_DRAFT, null);
      if (ptr && ptr.caseId === c.id) localStorage.removeItem(K_DRAFT);
      const id = c.id;
      wizCase = null;
      toast(c.status === "reviewed" ? "記録を閉じました。後日追記を忘れずに。" : "下書きのまま保存しました");
      nav("#case/" + id);
    });
  }];
}

/* ================================================================ #case/<id> */
function renderDetail(id) {
  const c = loadCaseById(id);
  if (!c) { toast("記録が見つかりません"); nav("#list"); return; }
  if (c.status === "draft") { wizardIntent = { caseId: c.id, step: c.wizardStep || 1 }; nav("#new"); return; }
  const d = D_BY_ID[c.disease];
  const sf2 = ET[2].subfields, sf3 = ET[3].subfields, sf4 = ET[4].subfields, sf5 = ET[5].subfields, sf6 = ET[6].subfields;
  let html = '<div class="btnrow" style="margin-top:0"><button type="button" class="btn ghost small" id="dBack">← 一覧</button></div>' +
    '<div class="panel"><h2>' + esc(diseaseLabel(c.disease) || "病態未選択") + "　" + esc(fmtD(c.createdAt)) + "</h2>" +
    "<div>" + statusBadge(c) + editedBadge(c) + matchBadge(c) + "</div>" +
    '<p class="subnote">記録ID ' + esc(c.id) + "　ロック " + esc(c.lock ? fmtDT(c.lock.lockedAt) : "―") + "</p>" +
    (c.editedAfterLock ? '<p class="subnote">※ 対比・書き出し・集計の「画像前」は、常にロック時点の記録（snapshot）を使います。</p>' : "") +
    "</div>";
  if (isUnfinished(c)) {
    html += '<div class="banner"><span class="bx">この記録はまだ途中です（S' + (c.wizardStep || 5) + "）。</span>" +
      '<button type="button" class="btn small" id="dResume">続きを記録する</button></div>';
  }
  /* 現在値の読み取り表示（訂正があれば current、画像前の採点は snapshot 側） */
  html += '<div class="panel"><h2>' + esc(stripNo(ET[1].heading)) + "・病態</h2>" +
    kvRow(stripNo(ET[1].heading), c.question) +
    (c.qtype === "quant" ? kvRow(UI.qtype_label, UI.qtype_quant) : "") +
    kvRow("病態／年代／性別", [diseaseLabel(c.disease), c.age, c.sex].filter(Boolean).join("・")) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="s1" data-step="1">訂正する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[2].heading) + "</h2>" +
    kvRow(sf2[0], c.pre.firstDx) + kvRow(sf2[1], c.pre.conf + "%") +
    (c.qtype === "quant" ? kvRow(UI.quant_pred_label, quantPredText(c.pre)) : "") +
    kvRow(sf2[2], c.pre.altDx) +
    kvRow(sf2[3], composeSite(c.pre.site)) + kvRow(sf2[4], c.pre.rationale) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="pre" data-step="2">訂正する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[3].heading) + "</h2>" +
    kvRow(sf3[0], d ? checkedLabels(d.exam_items, c.exam.checks, 1).join("、") : "") +
    kvRow(sf3[1], derivedMissing(c.exam, c.disease).concat(c.exam.missingExpectedManual || []).join("、")) +
    kvRow(sf3[2], c.exam.freeText) + kvRow(sf3[3], c.exam.limitations) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-fix="exam" data-step="3">訂正する</button></div></div>';
  const dSitesTxt = (c.pocus.sites || []).map(composeSite).filter(Boolean).join("／");
  html += '<div class="panel"><h2>' + esc(ET[4].heading) + "</h2>" +
    kvRow(sf4[0], (d ? checkedLabels(d.pocus_items, c.pocus.checks, 1).join("、") : "") +
      (dSitesTxt ? "\n位置：" + dSitesTxt : "") + (c.pocus.findings ? "\n" + c.pocus.findings : "")) +
    kvRow(sf4[1], c.pocus.confirmed) + kvRow(sf4[2], c.pocus.refuted) +
    kvRow(sf4[3], c.lock ? confMove(c).text : "") + kvRow(sf4[4], c.pocus.newSuspicion) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-edit-step="5">編集する</button></div></div>';
  html += '<div class="panel"><h2>' + esc(ET[6].heading) + "・" + esc(stripNo(ET[7].heading)) + "</h2>" +
    kvRow(sf6[0], c.compare.hit) + kvRow(sf6[1], c.compare.miss) +
    kvRow(sf6[2], classLabel(c)) +
    kvRow(sf6[3], c.compare.nextAction) + kvRow(UI.teaching_point_label, c.compare.teachingPoint) +
    '<div class="btnrow"><button type="button" class="btn ghost small" data-edit-step="6">編集する</button></div></div>';
  /* 後日追記（outcome はロック保護の対象外） */
  html += '<div class="panel"><h2>後日追記 ── ' + esc(stripNo(ET[5].heading)) + '</h2>' +
    fieldText({ id: "o_ct", label: sf5[0], value: c.outcome.ct, multiline: true, rows: 2 }) +
    fieldText({ id: "o_tests", label: sf5[1], value: c.outcome.tests, multiline: true, rows: 2 }) +
    fieldText({ id: "o_final", label: sf5[2], value: c.outcome.finalDx, multiline: true, rows: 2 }) +
    '<div class="field"><label for="o_gap">' + esc(sf5[3]) + '（時間）</label>' +
    '<input type="number" id="o_gap" min="0" step="1" inputmode="numeric" value="' + esc(c.outcome.gapHours) + '"></div>' +
    chipsField({ label: "一致判定（予測と最終診断）", name: "match", options: ["はい", "部分", "いいえ", "未確定"], selected: [MATCH_LABEL[c.outcome.match] || "未確定"], single: true }) +
    '<p class="subnote">「はい／部分／いいえ」を選ぶと集計の対象になります。</p>' +
    /* 軸1の答えの正本（画像後の入力なのでロック保護の対象外。match とは別物） */
    chipsField({ label: UI.disease_present_label, name: "dpresent", options: ["はい", "いいえ", "不明"],
      selected: [DP_LABEL[c.outcome.diseasePresent] || "不明"], single: true }) +
    '<p class="subnote">' + esc(UI.disease_present_note) + "</p>" +
    (c.qtype === "quant"
      ? '<div class="field"><label for="o_qact">' + esc(UI.quant_actual_label) +
        (c.pre.quantPred && c.pre.quantPred.unit ? "（" + esc(c.pre.quantPred.unit) + "）" : "") + "</label>" +
        '<input type="number" id="o_qact" step="0.5" inputmode="decimal" value="' +
        esc(c.outcome.quantActual && typeof c.outcome.quantActual.value === "number" ? c.outcome.quantActual.value : "") + '"></div>'
      : "") +
    "</div>";
  /* 補記（画像後・append-only。タップ今・文章あとで） */
  html += '<div class="panel"><h2>補記（画像後）</h2>' +
    '<p class="subnote">' + esc(UI.addendum_note) + "</p>" +
    ((c.addenda || []).length
      ? c.addenda.map(a => '<div class="kv"><div class="k">' + esc(fmtDT(a.at)) + '</div><div class="v">' + esc(a.text) + "</div></div>").join("")
      : '<p class="note">（まだありません）</p>') +
    '<div class="btnrow"><button type="button" class="btn line" id="addAdx">補記を足す</button></div></div>';
  /* 書き出し */
  html += '<div class="panel"><h2>テキスト書き出し</h2>' +
    '<pre class="export">' + esc(buildExportText(c)) + "</pre>" +
    '<div class="btnrow"><button type="button" class="btn line" id="dCopy">テキストをコピー</button></div></div>';
  if (c.editLog.length) {
    const names = { s1: "問い・病態", pre: stripNo(ET[2].heading), exam: stripNo(ET[3].heading) };
    html += '<div class="panel"><h2>訂正履歴</h2><ul class="editlog">' +
      c.editLog.map(l => "<li>" + esc(fmtDT(l.at)) + "　" + esc(names[l.section] || l.section) + "</li>").join("") + "</ul></div>";
  }
  html += footerHTML();
  $("#app").innerHTML = html;

  $("#dBack").addEventListener("click", () => nav("#list"));
  const dr = $("#dResume");
  if (dr) dr.addEventListener("click", () => { wizardIntent = { caseId: c.id, step: c.wizardStep || 5 }; nav("#new"); });
  $$("[data-fix]").forEach(b => b.addEventListener("click", () => {
    const section = b.dataset.fix, step = +b.dataset.step;
    if (canWriteSection(c, section) || editAfterLock(c, section)) {
      wizardIntent = { caseId: c.id, step: step };
      nav("#new");
    }
  }));
  $$("[data-edit-step]").forEach(b => b.addEventListener("click", () => {
    wizardIntent = { caseId: c.id, step: +b.dataset.editStep };
    nav("#new");
  }));
  bindText("#o_ct", c, "outcome", (cc, v) => { cc.outcome.ct = v; });
  bindText("#o_tests", c, "outcome", (cc, v) => { cc.outcome.tests = v; });
  bindText("#o_final", c, "outcome", (cc, v) => { cc.outcome.finalDx = v; });
  const gap = $("#o_gap");
  gap.addEventListener("input", () => writeCase(c, "outcome", cc => { cc.outcome.gapHours = gap.value; }));
  const M_REV = { "はい": "yes", "部分": "partial", "いいえ": "no", "未確定": "pending" };
  bindChips("match", c, "outcome", (cc, label) => { cc.outcome.match = M_REV[label] || "pending"; });
  const DP_REV = { "はい": "yes", "いいえ": "no", "不明": "unknown" };
  bindChips("dpresent", c, "outcome", (cc, label) => { cc.outcome.diseasePresent = DP_REV[label] || "unknown"; });
  const qa = $("#o_qact");
  if (qa) qa.addEventListener("input", () => writeCase(c, "outcome", cc => {
    cc.outcome.quantActual = qa.value === "" ? null : { value: Number(qa.value) };
  }));
  $("#addAdx").addEventListener("click", () => openAddendumModal(c));
  $("#dCopy").addEventListener("click", () => copyText(buildExportText(c)));
}
/* 補記モーダル（append-only: 保存後の編集・削除UIは意図的に無い） */
function openAddendumModal(c) {
  const root = openModal('<div class="sheet-h">補記を足す（画像後）</div>' +
    '<p class="subnote">' + esc(UI.addendum_note) + "　保存後の編集・削除はできません。</p>" +
    '<textarea id="adxText" rows="4" placeholder="' + esc(UI.anon_placeholder) + '"></textarea>' +
    '<div class="btnrow split"><button type="button" class="btn ghost" data-close>閉じる</button>' +
    '<button type="button" class="btn" id="adxSave">保存する</button></div>');
  $("#adxSave", root).addEventListener("click", () => {
    if (addAddendum(c, $("#adxText").value)) { closeModal(); toast("補記を足しました"); renderDetail(c.id); }
    else toast("本文を入力してください");
  });
}

/* ================================================================ #stats */
function renderStats() {
  const all = allCases();
  const filter = renderStats._filter || "";
  const done = all.filter(c => c.lock && c.outcome && c.outcome.match && c.outcome.match !== "pending" &&
    (!filter || c.disease === filter));
  let html = pageHeader("集計 ── 一致判定（はい／部分／いいえ）が確定した記録だけを数える。") +
    '<div class="panel"><div class="field"><label for="stFilter">疾患フィルタ</label><select id="stFilter">' +
    '<option value="">すべての病態</option>' +
    DISEASES.map(d => '<option value="' + d.id + '"' + (filter === d.id ? " selected" : "") + ">" + esc(d.label) + "</option>").join("") +
    "</select></div>" +
    '<p class="note">対象：' + done.length + " 件（一致判定が確定した記録）</p>" +
    '<p class="subnote">うち「' + esc(UI.edited_after_lock_badge) + "」 " +
    done.filter(c => c.editedAfterLock).length + " 件</p>";

  if (done.length < 5) {
    html += '<div class="hintbox">' + esc(UI.small_n_note) + "</div></div>";
  } else {
    const rows = done.map(c => {
      const conf = snapOf(c).pre.conf;
      const score = matchScore(c.outcome.match);
      return { conf: conf, score: score, gap: conf - score, prim: c.compare.missPrimary || "" };
    });
    const mv = statsMove(done);
    const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
    const f1 = x => (x >= 0 ? "+" : "") + x.toFixed(1);
    html += '<div class="stat3">' +
      "<div><b>" + f1(mean(rows.map(r => r.gap))) + "</b><span>平均外れ幅<br>（確信度−的中）</span></div>" +
      "<div><b>" + mean(rows.map(r => Math.abs(r.gap))).toFixed(1) + "</b><span>平均絶対外れ幅</span></div>" +
      "<div><b>" + (mv.n ? mv.absMean.toFixed(1) : "―") + "</b><span>POCUS 前後の確信度移動<br>（絶対値平均）　↑" + mv.up + "件・↓" + mv.down + "件</span></div>" +
      "</div>" +
      '<p class="subnote">的中スコア：はい=100／部分=50／いいえ=0。外れ幅＝ロック時の確信度−的中スコア（＋は自信過剰方向）。' +
      '確信度移動＝POCUS 後の確信度−ロック時の確信度（POCUS 後の確信度を入力した記録のみ・±0 は件数に数えない）。</p>';
    /* 5ビン較正表 */
    const bins = [[0, 20], [21, 40], [41, 60], [61, 80], [81, 100]];
    html += "<h2>確信度と的中の較正表</h2>" +
      '<p class="subnote">上の棒（灰）＝そのビンの平均確信度、下の棒（緑）＝平均的中スコア。二本が揃うほど較正が良い。</p>' +
      bins.map(b => {
        const rs = rows.filter(r => r.conf >= b[0] && r.conf <= b[1]);
        const label = b[0] + "–" + b[1] + "%";
        if (!rs.length) return '<div class="srow"><span class="bin">' + label + '</span><span class="n">0件</span><span class="subnote">―</span></div>';
        const mc = mean(rs.map(r => r.conf)), ms = mean(rs.map(r => r.score));
        return '<div class="srow"><span class="bin">' + label + '</span><span class="n">' + rs.length + "件</span>" +
          '<span class="bars"><span class="bar conf"><i style="width:' + mc + '%"></i></span>' +
          '<span class="bar"><i style="width:' + ms + '%"></i></span></span></div>';
      }).join("");
    /* 外れ方8分類の内訳（"none"＝外れなし は8分類として数えず、別枠1行で示す） */
    const bd = missBreakdown(rows);
    const maxN = Math.max(1, Math.max.apply(null, bd.cats.map(x => x.n)));
    html += '<h2 style="margin-top:14px">外れ方の分類（主）の内訳</h2>' +
      bd.cats.map(x =>
        '<div class="mrow"><span>' + esc(x.label) + '</span><span class="n">' + x.n + "</span>" +
        '<span class="bar"><i style="width:' + (x.n / maxN * 100) + '%"></i></span></div>').join("") +
      '<div class="mrow" style="border-top:1px solid var(--rule)"><span>' + esc(UI.no_miss_label) +
      '</span><span class="n">' + bd.none + '</span><span class="subnote">8分類（外れ方）とは別枠</span></div>' +
      "</div>";
  }

  /* ---- 軸1: 自分の尤度比（実測）。対象＝ロック済み＋病態の有無（はい/いいえ）確定。
     疾患フィルタは snapshot の病態で適用（採点はすべてロック時点の記録で行うため） ---- */
  const plrCases = personalLRTargets(all, filter);
  const agg = personalLRAggregate(plrCases);
  const f2 = x => x.toFixed(2);
  html += '<div class="panel"><h2>' + esc(UI.plr_title) + " <small>PERSONAL LR</small></h2>" +
    '<p class="note">' + esc(UI.plr_intro) + "</p>" +
    '<div class="hintbox">' + esc(UI.plr_bias_note) + "</div>" +
    '<p class="subnote">' + esc(UI.plr_privacy_note) + "</p>";
  const plrDids = DISEASES.map(d => d.id).filter(id => agg[id]);
  if (!plrDids.length) {
    html += '<p class="note">' + esc(UI.plr_empty) + "</p>";
  } else {
    let anyCorrected = false, anyExport = false;
    plrDids.forEach(did => {
      const g = agg[did], d = D_BY_ID[did];
      html += '<div class="cat">' + esc(d.label) + "　" +
        esc(fmtTpl(UI.plr_group_fmt, { present: g.present, absent: g.absent })) + "</div>";
      let eligible = 0;
      (d.exam_items || []).forEach(it => {
        const cnt = g.counts[it.id];
        if (!cnt) return;
        const n = plrRowCounts(cnt);
        if (plrRowEligible(cnt)) {
          eligible++;
          const m = lrFromCounts(cnt);
          anyCorrected = anyCorrected || m.corrected;
          html += '<div class="plrrow"><div class="nm">' + esc(it.label) + "</div>" +
            '<div class="vals">' + esc(UI.plr_sens) + " " + Math.round(m.sens * 100) + "%・" +
            esc(UI.plr_spec) + " " + Math.round(m.spec * 100) + "%／" +
            esc(UI.plr_lrp) + " " + f2(m.lp) + "（" + esc(UI.plr_ci) + " " + f2(m.ci[0]) + "–" + f2(m.ci[1]) + "）・" +
            esc(UI.plr_lrn) + " " + f2(m.ln) + "（" + f2(m.cin[0]) + "–" + f2(m.cin[1]) + "）" +
            (m.corrected ? "・" + esc(UI.plr_corrected_badge) : "") + "</div></div>";
        } else {
          html += '<div class="plrrow"><div class="nm">' + esc(it.label) + "</div>" +
            '<div class="prog">' + esc(fmtTpl(UI.plr_progress, { present: n.present, absent: n.absent })) + "</div></div>";
        }
      });
      if (eligible) {
        if (BEDSIDE_KEYS[did]) {
          anyExport = true;
          html += '<div class="btnrow"><button type="button" class="btn line" data-plr-export="' + esc(did) + '">' +
            esc(UI.plr_export_button) + "</button></div>";
        } else {
          html += '<p class="subnote">' + esc(UI.plr_no_bridge_note) + "</p>";
        }
      }
    });
    if (anyCorrected) html += '<p class="subnote">' + esc(UI.plr_corrected_note) + "</p>";
    if (anyExport) html += '<p class="subnote">' + esc(UI.plr_clipboard_note) + "</p>";
  }
  html += "</div>";

  /* ---- 軸2: 定量の癖と床（qtype=quant・予測値と実測値が揃った記録） ---- */
  const qg = quantAggregate(all, filter);
  const f1s = x => (x >= 0 ? "+" : "") + x.toFixed(1);
  html += '<div class="panel"><h2>' + esc(UI.quant_title) + " <small>QUANT</small></h2>" +
    '<p class="note">' + esc(UI.quant_intro) + "</p>";
  if (!qg.length) {
    html += '<p class="note">' + esc(UI.quant_empty) + "</p>";
  } else {
    qg.forEach(g => {
      html += '<div class="cat">' + esc(diseaseLabel(g.disease)) + "・" + esc(g.unit) + "　" + g.n + "件</div>";
      if (g.n < QUANT_MIN_N) {
        html += '<p class="subnote">' + esc(UI.quant_small_n) + "</p>";
      } else {
        const u = g.unit === "その他" ? "" : " " + g.unit;
        html += '<div class="stat3">' +
          "<div><b>" + esc(f1s(g.mean) + u) + "</b><span>" + esc(UI.quant_mean_label) + "</span></div>" +
          "<div><b>" + esc(g.sd.toFixed(1) + u) + "</b><span>" + esc(UI.quant_sd_label) + "</span></div>" +
          "<div><b>" + esc(g.rcv.toFixed(1) + u) + "</b><span>" + esc(UI.quant_rcv_label) + "</span></div>" +
          "</div>";
      }
    });
    html += '<p class="subnote">' + esc(UI.quant_rcv_note) + "</p>";
  }
  html += "</div>";

  html += footerHTML();
  $("#app").innerHTML = html;
  $("#stFilter").addEventListener("change", e => { renderStats._filter = e.target.value; renderStats(); });
  /* 自分パネルの書き出し（クリップボードへ。契約 version 1 の JSON） */
  $$("[data-plr-export]").forEach(b => b.addEventListener("click", () => {
    const panel = buildPersonalPanel(b.dataset.plrExport, agg[b.dataset.plrExport]);
    if (panel) copyText(JSON.stringify(panel));
  }));
}

/* ================================================================ #settings */
function usageEstimate() {
  let chars = 0, cases = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("awn.") === 0) {
      chars += k.length + (localStorage.getItem(k) || "").length;
      if (k.indexOf(K_CASE) === 0) cases++;
    }
  }
  return { kb: (chars * 2 / 1024).toFixed(1), cases: cases };
}
function unbackedCount() {
  const s = lsGet(K_SETTINGS, {});
  const t = s.lastBackupAt || "";
  const cs = allCases().filter(c => !t || (c.updatedAt || "") > t).length;
  const qs = lsGet(K_QUICK, []).filter(q => !t || (q.createdAt || "") > t).length;
  return cs + qs;
}
function renderSettings() {
  const s = lsGet(K_SETTINGS, {});
  const u = usageEstimate();
  const html = pageHeader("設定 ── データはこの端末の中にしかない。だからバックアップする。") +
    '<div class="panel"><h2>バックアップ <small>BACKUP</small></h2>' +
    '<p class="note">全記録を JSON 1ファイルで書き出します。前回：' + (s.lastBackupAt ? esc(fmtDT(s.lastBackupAt)) : "未実施") +
    "／未バックアップ " + unbackedCount() + " 件</p>" +
    '<div class="btnrow"><button type="button" class="btn" id="bkBtn">JSON をダウンロード</button></div></div>' +
    '<div class="panel"><h2>復元 <small>RESTORE</small></h2>' +
    '<p class="note">バックアップ JSON を選ぶと、件数を確認してから「全置換」か「マージ」（同じ記録IDは更新の新しい方を残す）を選べます。</p>' +
    '<input type="file" id="rsFile" accept=".json,application/json"></div>' +
    '<div class="panel"><h2>データ <small>STORAGE</small></h2>' +
    '<p class="note">使用量（概算）：' + u.kb + " KB／症例 " + u.cases + " 件・一行記録 " + lsGet(K_QUICK, []).length + " 件</p>" +
    '<p class="note" id="persistState">端末へのデータ保持（persist）：確認中…</p>' +
    '<div class="btnrow"><button type="button" class="btn line" id="psBtn">端末にデータ保持を要求する</button>' +
    '<button type="button" class="btn danger" id="wipeBtn">全データを消去</button></div></div>' +
    '<div class="panel"><h2>参照 <small>REFERENCES</small></h2>' +
    '<p class="linkline">' + esc(CONTENT.links.bedside_bayes_note) + "：<br>" +
    '<a href="' + esc(CONTENT.links.bedside_bayes) + '" target="_blank" rel="noopener">' + esc(CONTENT.links.bedside_bayes) + "</a></p>" +
    '<p class="note">' + esc(CONTENT.links.guide_ref) + "<br>" + esc(CONTENT.links.nejm_ref) + "</p>" +
    '<p class="note">このアプリは診療の判断を代行しません。記録と較正のための教育ツールです。</p>' +
    '<p class="subnote">バージョン：' + esc(APP_VERSION) + "</p></div>" +
    footerHTML();
  $("#app").innerHTML = html;
  $("#bkBtn").addEventListener("click", doBackup);
  $("#rsFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { handleRestore(String(r.result)); e.target.value = ""; };
    r.readAsText(f);
  });
  $("#wipeBtn").addEventListener("click", () => {
    if (!confirm("全データ（症例・一行記録・設定）をこの端末から消去します。よろしいですか？")) return;
    if (!confirm("本当に消去しますか？ バックアップが無ければ元に戻せません。")) return;
    wipeAll();
    toast("消去しました");
    renderSettings();
  });
  const ps = $("#psBtn");
  refreshPersistState();
  ps.addEventListener("click", async () => {
    if (!(navigator.storage && navigator.storage.persist)) { toast("この環境では要求できません"); return; }
    const ok = await navigator.storage.persist();
    toast(ok ? "端末がデータ保持を受け付けました" : "受け付けられませんでした（ブックマーク追加やホーム画面追加で通りやすくなります）");
    refreshPersistState();
  });
}
async function refreshPersistState() {
  const el = $("#persistState");
  if (!el) return;
  if (navigator.storage && navigator.storage.persisted) {
    const p = await navigator.storage.persisted();
    el.textContent = "端末へのデータ保持（persist）：" + (p ? "有効" : "未設定（ブラウザ都合で消えることがあります）");
  } else {
    el.textContent = "端末へのデータ保持（persist）：この環境では確認できません";
  }
}
function doBackup() {
  const data = { app: "kotaeawase-note", schemaVersion: 1, exportedAt: nowISO(), cases: allCases(), quick: lsGet(K_QUICK, []) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kotaeawase-backup-" + todayStr().replace(/-/g, "") + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  const s = lsGet(K_SETTINGS, {});
  s.lastBackupAt = nowISO();
  try { lsSet(K_SETTINGS, s); } catch (e) {}
  toast("バックアップを書き出しました");
  renderSettings();
}
function handleRestore(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { alert("JSON として読めませんでした。"); return; }
  if (!data || data.app !== "kotaeawase-note" || !Array.isArray(data.cases)) {
    alert("このアプリのバックアップではありません（app 識別子が一致しません）。"); return;
  }
  if ((data.schemaVersion || 1) > 1) {
    alert("このバックアップは新しい版のものです。アプリを更新してから復元してください。"); return;
  }
  const cases = data.cases.map(migrateCase).filter(Boolean);
  const quick = Array.isArray(data.quick) ? data.quick.filter(q => q && q.id) : [];
  const cur = allCases();
  const root = openModal('<div class="sheet-h">復元の確認</div>' +
    '<p class="note">読み込み：症例 ' + cases.length + " 件・一行記録 " + quick.length + " 件<br>" +
    "現在：症例 " + cur.length + " 件・一行記録 " + lsGet(K_QUICK, []).length + " 件</p>" +
    '<div class="btnrow"><button type="button" class="btn danger" id="rsReplace">全置換（現在を消して読み込む）</button>' +
    '<button type="button" class="btn" id="rsMerge">マージ（同IDは新しい方）</button>' +
    '<button type="button" class="btn ghost" data-close>キャンセル</button></div>');
  $("#rsReplace", root).addEventListener("click", () => {
    if (!confirm("現在の全記録を消して、読み込んだ内容に置き換えます。よろしいですか？")) return;
    wipeAll();
    cases.forEach(c => { try { lsSet(K_CASE + c.id, c); } catch (e) {} });
    try { lsSet(K_QUICK, quick); } catch (e) {}
    finishRestore();
  });
  $("#rsMerge", root).addEventListener("click", () => {
    const byId = {};
    cur.forEach(c => { byId[c.id] = c; });
    cases.forEach(c => {
      const ex = byId[c.id];
      if (!ex || (c.updatedAt || "") > (ex.updatedAt || "")) byId[c.id] = c;
    });
    Object.keys(byId).forEach(id => { try { lsSet(K_CASE + id, byId[id]); } catch (e) {} });
    const qCur = lsGet(K_QUICK, []);
    const qIds = {}; qCur.forEach(q => { qIds[q.id] = true; });
    quick.forEach(q => { if (!qIds[q.id]) qCur.push(q); });
    try { lsSet(K_QUICK, qCur); } catch (e) {}
    finishRestore();
  });
  function finishRestore() {
    wizCase = null; wizardIntent = null;
    localStorage.removeItem(K_DRAFT);
    closeModal();
    toast("復元しました");
    renderSettings();
  }
}
function wipeAll() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf("awn.") === 0) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  wizCase = null; wizardIntent = null; pendingCase = null;
  initMeta();
}

/* ---------------------------------------------------------------- bootstrap */
initMeta();
route();
addEventListener("hashchange", route);
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>
